services:
  postgres:
    image: postgres:16
    container_name: messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      HTTP_ADDR: :8082
      GRPC_ADDR: :9090
    ports:
      - "8082:8082"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
