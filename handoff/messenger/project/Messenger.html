<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; font-family: 'Inter', sans-serif; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }

input, textarea, button { font-family: inherit; }

/* CSS Variables - Dark (default) */
:root {
  --bg:          #0b0b10;
  --sidebar:     #0f0f18;
  --sidebar-hover: #161624;
  --panel:       #13131e;
  --panel-border:#1e1e30;
  --chat-bg:     #0d0d16;
  --bubble:      #1a1a2e;
  --bubble-me:   #7c6fff;
  --input-bg:    #181828;
  --input-border:#252540;
  --text:        #e8e8f0;
  --text-muted:  #7070a0;
  --text-soft:   #a0a0c8;
  --accent:      #7c6fff;
  --accent-hover:#9380ff;
  --danger:      #ff5b5b;
  --online:      #3be8a0;
  --divider:     #1a1a2c;
  --shadow:      0 24px 60px rgba(0,0,0,0.5);
  --modal-bg:    rgba(0,0,0,0.65);
  --check-color: rgba(255,255,255,0.6);
}

/* Light theme */
:root.light {
  --bg:          #f2f4f8;
  --sidebar:     #ffffff;
  --sidebar-hover: #f0f2f8;
  --panel:       #ffffff;
  --panel-border:#e4e8f0;
  --chat-bg:     #eef0f6;
  --bubble:      #ffffff;
  --bubble-me:   #7c6fff;
  --input-bg:    #f0f2f8;
  --input-border:#d8dce8;
  --text:        #111118;
  --text-muted:  #8888aa;
  --text-soft:   #555570;
  --accent:      #7c6fff;
  --accent-hover:#6a5dee;
  --danger:      #e03535;
  --online:      #22cc88;
  --divider:     #e4e8f0;
  --shadow:      0 16px 40px rgba(0,0,0,0.12);
  --modal-bg:    rgba(0,0,0,0.35);
  --check-color: rgba(255,255,255,0.75);
}

body { background: var(--bg); color: var(--text); transition: background .25s, color .25s; }

/* Animations */
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeSlideInLeft {
  from { opacity: 0; transform: translateX(-12px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes fadeSlideInRight {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes bubbleInMe {
  from { opacity: 0; transform: translateX(18px) scale(0.95); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes bubbleInOther {
  from { opacity: 0; transform: translateX(-18px) scale(0.95); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.msg-me    { animation: bubbleInMe    .22s cubic-bezier(.34,1.4,.64,1) both; }
.msg-other { animation: bubbleInOther .22s cubic-bezier(.34,1.4,.64,1) both; }
.conv-item { animation: fadeSlideInLeft .18s ease both; }
.modal-card { animation: popIn .2s cubic-bezier(.34,1.3,.64,1) both; }
.chat-area  { animation: fadeSlideIn .2s ease both; }

/* Tweaks panel */
#tweaks-panel {
  display: none; position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 16px; padding: 20px; width: 240px; box-shadow: var(--shadow);
}
#tweaks-panel.visible { display: block; animation: popIn .18s ease both; }
#tweaks-panel h4 { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; letter-spacing: .08em; text-transform: uppercase; }
.tweak-row { margin-bottom: 12px; }
.tweak-row label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
.tweak-row input[type=color] { width: 100%; height: 32px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 0; }
.tweak-row select { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <h4>Tweaks</h4>
  <div class="tweak-row"><label>Акцентный цвет</label><input type="color" id="tw-accent" value="#7c6fff" /></div>
  <div class="tweak-row"><label>Шрифт</label>
    <select id="tw-font">
      <option value="Inter">Inter</option>
      <option value="'IBM Plex Sans'">IBM Plex Sans</option>
      <option value="'Space Grotesk'">Space Grotesk</option>
    </select>
  </div>
</div>

<script type="text/babel">

const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ─── Theme Context ─────────────────────────────────────────────────────────

const useTheme = () => useContext(ThemeCtx);

// ─── Helpers ───────────────────────────────────────────────────────────────
function initials(name) { return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function timeStr(d) { return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}); }
function dayStr(d) {
  const now = new Date(), diff = Math.floor((now-d)/86400000);
  if (diff===0) return 'Сегодня'; if (diff===1) return 'Вчера';
  return d.toLocaleDateString('ru',{day:'numeric',month:'long'});
}

  {id:'bob',    type:'dm',    peer:USERS[1], lastMsg:'Ок, буду',                 lastTs:mins(118), unread:0},

  {id:'dan',    type:'dm',    peer:USERS[3], lastMsg:'Спасибо!',                  lastTs:mins(2000),unread:0},
];

// ─── SVG Icons ─────────────────────────────────────────────────────────────
const Ic = ({d,size=18,color='currentColor',style={}}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
    strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}>
    <path d={d}/>
  </svg>
);
const icons = {
  search:  "M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z",
  send:    "M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z",
  edit:    "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
  logout:  "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  plus:    "M12 5v14M5 12h14",
  close:   "M18 6L6 18M6 6l12 12",
  check:   "M20 6L9 17l-5-5",
  settings:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z",
  sun:     "M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z",
  moon:    "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
  user:    "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  group:   "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  danger:  "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
  camera:  "M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
};

// ─── Avatar ────────────────────────────────────────────────────────────────
function Avatar({name,color,size=38,online=false}) {
  return (
    <div style={{position:'relative',flexShrink:0}}>
      <div style={{
        width:size,height:size,borderRadius:'50%',background:color||'var(--accent)',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:size*0.36,fontWeight:600,color:'#fff',letterSpacing:'-0.02em',userSelect:'none',
        transition:'transform .15s',
      }}>{initials(name)}</div>
      {online && <div style={{
        position:'absolute',bottom:1,right:1,
        width:size*0.28,height:size*0.28,borderRadius:'50%',
        background:'var(--online)',border:'2.5px solid var(--sidebar)',
      }}/>}
    </div>
  );
}

// ─── Modal Wrapper ─────────────────────────────────────────────────────────
function Modal({onClose,children,width=420}) {
  useEffect(() => {
    const fn = e => { if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown',fn);
    return () => window.removeEventListener('keydown',fn);
  },[]);
  return (
    <div style={{
      position:'fixed',inset:0,background:'var(--modal-bg)',backdropFilter:'blur(6px)',
      display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,
      animation:'fadeSlideIn .18s ease both',
    }} onClick={onClose}>
      <div className="modal-card" onClick={e=>e.stopPropagation()} style={{
        background:'var(--panel)',border:'1px solid var(--panel-border)',
        borderRadius:22,padding:30,width:`min(${width}px,92vw)`,
        boxShadow:'var(--shadow)',
      }}>{children}</div>
    </div>
  );
}

function ModalHeader({title,onClose}) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
      <div style={{fontWeight:700,fontSize:17,color:'var(--text)'}}>{title}</div>
      <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',padding:4,borderRadius:8,display:'flex',transition:'color .15s'}}
        onMouseEnter={e=>e.currentTarget.style.color='var(--text)'}
        onMouseLeave={e=>e.currentTarget.style.color='var(--text-muted)'}>
        <Ic d={icons.close} size={18}/>
      </button>
    </div>
  );
}

// ─── Btn & Input ───────────────────────────────────────────────────────────
function Btn({children,onClick,variant='primary',style={},disabled=false,small=false}) {
  const [h,setH]=useState(false);
  const base={display:'inline-flex',alignItems:'center',gap:6,border:'none',cursor:disabled?'not-allowed':'pointer',
    borderRadius:10,fontWeight:500,transition:'all .15s',fontSize:small?13:14,
    padding:small?'7px 13px':'10px 18px',opacity:disabled?.5:1,
    transform:h&&!disabled?'translateY(-1px)':'none'};
  const v={
    primary:{background:h?'var(--accent-hover)':'var(--accent)',color:'#fff'},
    ghost:{background:h?'var(--sidebar-hover)':'transparent',color:'var(--text-soft)'},
    danger:{background:h?'#ff7070':'var(--danger)',color:'#fff'},
    subtle:{background:h?'var(--input-border)':'var(--input-bg)',color:'var(--text-soft)'},
  };
  return <button onClick={onClick} disabled={disabled}
    onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
    style={{...base,...v[variant],...style}}>{children}</button>;
}

function TextInput({placeholder,value,onChange,type='text',autoFocus=false,style={},icon=null}) {
  const [focus,setFocus]=useState(false);
  return (
    <div style={{position:'relative',width:'100%'}}>
      {icon&&<div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',pointerEvents:'none',display:'flex'}}>{icon}</div>}
      <input type={type} placeholder={placeholder} value={value} onChange={onChange} autoFocus={autoFocus}
        onFocus={()=>setFocus(true)} onBlur={()=>setFocus(false)}
        style={{
          width:'100%',background:'var(--input-bg)',
          border:`1px solid ${focus?'var(--accent)':'var(--input-border)'}`,
          borderRadius:10,padding:`10px 14px 10px ${icon?'38px':'14px'}`,color:'var(--text)',
          fontSize:14,outline:'none',transition:'border .15s',...style,
        }}/>
    </div>
  );
}

// ─── Toggle Switch ─────────────────────────────────────────────────────────
function Toggle({value,onChange,label}) {
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0'}}
      onClick={()=>onChange(!value)}>
      <span style={{fontSize:14,color:'var(--text)',cursor:'pointer'}}>{label}</span>
      <div style={{
        width:42,height:24,borderRadius:12,cursor:'pointer',transition:'background .2s',
        background:value?'var(--accent)':'var(--input-border)',position:'relative',flexShrink:0,
      }}>
        <div style={{
          position:'absolute',top:3,left:value?20:3,width:18,height:18,borderRadius:'50%',
          background:'#fff',transition:'left .2s',boxShadow:'0 1px 4px rgba(0,0,0,0.3)',
        }}/>
      </div>
    </div>
  );
}

// ─── Auth Screen ───────────────────────────────────────────────────────────
function AuthScreen({onLogin}) {
  const [tab,setTab]=useState('login');
  const [form,setForm]=useState({username:'',password:'',firstName:'',lastName:'',passwordRepeat:''});
  const [error,setError]=useState('');
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const submit=()=>{
    if(!form.username||!form.password){setError('Заполните все поля');return;}
    if(tab==='register'&&form.password!==form.passwordRepeat){setError('Пароли не совпадают');return;}
    onLogin({username:form.username,name:form.firstName?`${form.firstName} ${form.lastName}`.trim():form.username,color:'#7c6fff'});
  };

  return (
    <div style={{
      minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'radial-gradient(ellipse 900px 600px at 20% 30%,#1a1040 0%,transparent 60%), radial-gradient(ellipse 700px 500px at 80% 70%,#0d1a3a 0%,transparent 60%), var(--bg)',
      padding:24,
    }}>
      <div className="modal-card" style={{
        width:'min(440px,100%)',
        background:'linear-gradient(145deg, var(--panel) 0%, var(--sidebar) 100%)',
        border:'1px solid var(--panel-border)',borderRadius:24,padding:36,
        boxShadow:'0 32px 80px rgba(0,0,0,0.55)',
      }}>
        <div style={{marginBottom:32,textAlign:'center'}}>
          <div style={{width:56,height:56,borderRadius:16,background:'var(--accent)',display:'inline-flex',alignItems:'center',justifyContent:'center',marginBottom:16,fontSize:24,boxShadow:'0 8px 24px rgba(124,111,255,0.4)'}}>✦</div>
          <div style={{fontSize:22,fontWeight:700,color:'var(--text)'}}>Messenger</div>
          <div style={{fontSize:13,color:'var(--text-muted)',marginTop:4}}>gRPC-Web клиент</div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',background:'var(--input-bg)',borderRadius:12,padding:4,marginBottom:24}}>
          {['login','register'].map(t=>(
            <button key={t} onClick={()=>{setTab(t);setError('');}} style={{
              border:'none',cursor:'pointer',borderRadius:9,padding:'9px 0',fontWeight:500,fontSize:14,transition:'all .18s',
              background:tab===t?'var(--accent)':'transparent',color:tab===t?'#fff':'var(--text-muted)',
            }}>{t==='login'?'Вход':'Регистрация'}</button>
          ))}
        </div>

        <div style={{display:'grid',gap:12}}>
          {tab==='register'&&(
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <TextInput placeholder="Имя" value={form.firstName} onChange={set('firstName')}/>
              <TextInput placeholder="Фамилия" value={form.lastName} onChange={set('lastName')}/>
            </div>
          )}
          <TextInput placeholder="Никнейм" value={form.username} onChange={set('username')} autoFocus icon={<Ic d={icons.user} size={16}/>}/>
          <TextInput placeholder="Пароль" type="password" value={form.password} onChange={set('password')}/>
          {tab==='register'&&<TextInput placeholder="Повторите пароль" type="password" value={form.passwordRepeat} onChange={set('passwordRepeat')}/>}
          {error&&<div style={{fontSize:13,color:'var(--danger)',textAlign:'center',animation:'fadeSlideIn .15s ease'}}>{error}</div>}
          <Btn onClick={submit} style={{width:'100%',justifyContent:'center',marginTop:4}}>
            {tab==='login'?'Войти':'Создать аккаунт'}
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ─── Settings Modal ────────────────────────────────────────────────────────

// ─── Profile Edit Modal ────────────────────────────────────────────────────

// ─── Create Group Modal ────────────────────────────────────────────────────
function CreateGroupModal({onClose,onCreate,recentUserIds=[]}) {
  const [name,setName]=useState('');
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState([]);
  const toggle=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);

  const recentUsers=USERS.filter(u=>recentUserIds.includes(u.id));
  const searchResults=search.length>=1 ? USERS.filter(u=>
    u.name.toLowerCase().includes(search.toLowerCase())||
    u.username.toLowerCase().includes(search.toLowerCase())
  ) : [];
  const listToShow=search.length>=1 ? searchResults : recentUsers;

  const UserRow=({u})=>(
    <div key={u.id} onClick={()=>toggle(u.id)} style={{
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'8px 10px',borderRadius:10,cursor:'pointer',transition:'background .12s',
      background:selected.includes(u.id)?'rgba(124,111,255,0.1)':'transparent',
    }}
      onMouseEnter={e=>{if(!selected.includes(u.id))e.currentTarget.style.background='var(--sidebar-hover)';}}
      onMouseLeave={e=>{e.currentTarget.style.background=selected.includes(u.id)?'rgba(124,111,255,0.1)':'transparent';}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <Avatar name={u.name} color={u.color} size={34} online={u.online}/>
        <div>
          <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{u.name}</div>
          <div style={{fontSize:11,color:'var(--text-muted)'}}>@{u.username}</div>
        </div>
      </div>
      <div style={{
        width:20,height:20,borderRadius:6,flexShrink:0,
        border:`2px solid ${selected.includes(u.id)?'var(--accent)':'var(--input-border)'}`,
        background:selected.includes(u.id)?'var(--accent)':'transparent',
        display:'flex',alignItems:'center',justifyContent:'center',transition:'all .12s',
      }}>
        {selected.includes(u.id)&&<Ic d={icons.check} size={11} color="#fff"/>}
      </div>
    </div>

  return (
    <Modal onClose={onClose} width={400}>
      <ModalHeader title="Создать группу" onClose={onClose}/>

        <TextInput placeholder="Название группы" value={name} onChange={e=>setName(e.target.value)} autoFocus/>

        {/* Selected chips */}
        {selected.length>0&&(
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {selected.map(id=>{const u=USERS.find(x=>x.id===id);return u?(
              <div key={id} onClick={()=>toggle(id)} style={{
                display:'flex',alignItems:'center',gap:5,background:`${u.color}22`,
                border:`1px solid ${u.color}44`,borderRadius:20,padding:'3px 10px 3px 6px',cursor:'pointer',
              }}>
                <Avatar name={u.name} color={u.color} size={18}/>
                <span style={{fontSize:12,color:'var(--text)',fontWeight:500}}>{u.name.split(' ')[0]}</span>
                <Ic d={icons.close} size={10} color="var(--text-muted)"/>
              </div>
            ):null;})}
          </div>
        )}

        <TextInput placeholder="Поиск пользователей..." value={search} onChange={e=>setSearch(e.target.value)} icon={<Ic d={icons.search} size={15}/>}/>

        <div style={{maxHeight:240,overflowY:'auto'}}>
          {search.length<1&&recentUsers.length>0&&(
            <div style={{fontSize:11,color:'var(--text-muted)',padding:'0 4px 8px',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Недавние чаты</div>
          )}
          {search.length>=1&&searchResults.length===0&&(
            <div style={{textAlign:'center',color:'var(--text-muted)',fontSize:13,padding:'16px 0'}}>Ничего не найдено</div>

        <Btn onClick={()=>{if(name&&selected.length){onCreate(name,selected);onClose();}}}
          disabled={!name||!selected.length} style={{width:'100%',justifyContent:'center'}}>
          Создать группу {selected.length>0&&`(${selected.length})`}
        </Btn>
      </div>
    </Modal>
  );
}

// ─── Conv Item ─────────────────────────────────────────────────────────────

// Double check SVG (read receipt)
function DoubleCheck({read}) {
  // On sent (me) bubbles: always white-ish; read = brighter white, unread = dim white
  const c = read ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.45)';
  return (
    <svg width="20" height="12" viewBox="0 0 20 12" fill="none" style={{display:'inline-block',verticalAlign:'middle',flexShrink:0,marginLeft:2}}>
      <polyline points="1,6 5,10 12,2" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
      <polyline points="8,10 15,2" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
    </svg>
  );
}

// ─── Bubble ────────────────────────────────────────────────────────────────
function Bubble({msg,isMe,senderName,senderColor,showSender,isNew,isRead}) {
  return (
    <div className={isNew?(isMe?'msg-me':'msg-other'):''} style={{
      display:'flex',flexDirection:isMe?'row-reverse':'row',
      gap:8,marginBottom:4,alignItems:'flex-end',
    }}>
      {!isMe&&<Avatar name={senderName} color={senderColor} size={28}/>}
      <div style={{maxWidth:'65%'}}>
        {showSender&&!isMe&&(
          <div style={{fontSize:12,color:senderColor,fontWeight:500,marginBottom:3,marginLeft:4}}>{senderName}</div>
        )}
        <div style={{
          background:isMe?'var(--accent)':'var(--bubble)',
          color:isMe?'#fff':'var(--text)',
          padding:'9px 14px',
          borderRadius:16,
          borderBottomRightRadius:isMe?3:16,
          borderBottomLeftRadius:!isMe?3:16,
          fontSize:14,lineHeight:1.55,
          boxShadow:'0 2px 8px rgba(0,0,0,0.15)',
        }}>
          {msg.text}
          <div style={{fontSize:11,color:isMe?'var(--check-color)':'var(--text-muted)',textAlign:'right',marginTop:3,display:'flex',alignItems:'center',justifyContent:'flex-end',gap:4}}>
            {timeStr(msg.ts)}
            {isMe&&<DoubleCheck read={isRead}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

                <Ic d={icons.send} size={15}/> Написать сообщение
              </Btn>
            </div>
          )}
        </div>
      </Modal>
      {showAddMembers&&<AddMembersModal onClose={()=>setShowAddMembers(false)} existingIds={members.map(m=>m.id)}/>}
      {selectedMember&&<PeerProfileModal peer={selectedMember} isGroup={false} members={[]} onClose={()=>setSelectedMember(null)} onStartChat={onStartChat}/>}
    </>
  );
}

// ─── Chat Area ─────────────────────────────────────────────────────────────
function ChatArea({conv,currentUser,messages,onSend,onStartChat}) {
  const [text,setText]=useState('');
  const [msgIds,setMsgIds]=useState(new Set());
  const [showPeer,setShowPeer]=useState(false);
  const scrollRef=useRef();

  // Close peer modal when switching conversations
  useEffect(()=>{ setShowPeer(false); },[conv.id]);
  const isGroup=conv.type==='group';
  const name=isGroup?conv.name:conv.peer.name;
  const color=isGroup?'#5b8dee':conv.peer.color;
  const online=!isGroup&&conv.peer.online;
  const subtitle=isGroup?`${conv.members.length} участника`:(online?'в сети':'не в сети');

  useEffect(()=>{
    if(scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  },[messages, conv.id]);

  const send=()=>{
    if(!text.trim()) return;
    const id=Date.now();
    setMsgIds(s=>new Set([...s,id]));
    onSend(text.trim(),id);
    setText('');
  };

  let lastDate=null;
  return (
    <div className="chat-area" key={conv.id} style={{display:'flex',flexDirection:'column',height:'100%',background:'var(--chat-bg)'}}>
      {/* Header */}
      <div onClick={()=>setShowPeer(true)} style={{
        padding:'14px 20px',borderBottom:'1px solid var(--divider)',
        display:'flex',alignItems:'center',gap:12,
        background:'var(--panel)',backdropFilter:'blur(10px)',
        boxShadow:'0 1px 0 var(--divider)',cursor:'pointer',
        transition:'background .15s',
      }}
        onMouseEnter={e=>e.currentTarget.style.background='var(--sidebar-hover)'}
        onMouseLeave={e=>e.currentTarget.style.background='var(--panel)'}>
        <Avatar name={name} color={color} size={40} online={online}/>
        <div>
          <div style={{fontWeight:600,fontSize:15,color:'var(--text)'}}>{name}</div>
          <div style={{fontSize:12,color:online?'var(--online)':'var(--text-muted)',display:'flex',alignItems:'center',gap:5}}>
            {online&&<div style={{width:6,height:6,borderRadius:'50%',background:'var(--online)',animation:'pulse 2s infinite'}}/>}
            {subtitle}
          </div>
        </div>
        <div style={{marginLeft:'auto',color:'var(--text-muted)',opacity:0.5,fontSize:12}}>
          <Ic d={icons.user} size={16}/>
        </div>
      </div>
      {showPeer&&(
        <PeerProfileModal
          peer={isGroup?name:conv.peer}
          isGroup={isGroup}
          members={isGroup?conv.members:[]}
          onClose={()=>setShowPeer(false)}
          onStartChat={onStartChat}
        />
      )}

      {/* Messages */}
      <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'20px 20px 8px'}}>
        {messages.map((msg,i)=>{
          const d=dayStr(msg.ts),showDate=d!==lastDate;
          lastDate=d;
          const isMe=msg.from==='me';
          const sender=USERS.find(u=>u.id===msg.from)||{name:msg.from,color:'var(--accent)'};
          const showSender=isGroup&&!isMe&&(i===0||messages[i-1].from!==msg.from);
          return (
            <React.Fragment key={msg.id}>
              {showDate&&(
                <div style={{textAlign:'center',margin:'12px 0 16px'}}>
                  <span style={{fontSize:12,color:'var(--text-muted)',background:'var(--input-bg)',padding:'3px 14px',borderRadius:20}}>{d}</span>
                </div>
              )}
              <Bubble msg={msg} isMe={isMe} senderName={isMe?currentUser.name:sender.name}
                senderColor={sender.color} showSender={showSender} isNew={msgIds.has(msg.id)}
                isRead={i < messages.length - 1}/>
            </React.Fragment>
          );
        })}
      </div>

      {/* Input */}
      <div style={{padding:'12px 16px',background:'var(--panel)',borderTop:'1px solid var(--divider)'}}>
        <div style={{display:'flex',gap:8,alignItems:'flex-end',background:'var(--input-bg)',border:'1px solid var(--input-border)',borderRadius:14,padding:'8px 8px 8px 14px',transition:'border .15s'}}
          onFocus={e=>e.currentTarget.style.borderColor='var(--accent)'}
          onBlur={e=>e.currentTarget.style.borderColor='var(--input-border)'}>
          <textarea value={text} onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder="Написать сообщение..." rows={1}
            style={{flex:1,background:'transparent',border:'none',outline:'none',color:'var(--text)',fontSize:14,resize:'none',lineHeight:1.55,maxHeight:120,overflowY:'auto',padding:'2px 0'}}/>
          <button onClick={send} style={{
            background:text.trim()?'var(--accent)':'var(--input-border)',border:'none',
            cursor:text.trim()?'pointer':'default',borderRadius:10,width:36,height:36,
            display:'flex',alignItems:'center',justifyContent:'center',transition:'all .15s',
            flexShrink:0,color:'#fff',transform:text.trim()?'scale(1)':'scale(0.9)',
          }}>
            <Ic d={icons.send} size={16}/>
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Sidebar ───────────────────────────────────────────────────────────────
function Sidebar({currentUser,conversations,activeId,onSelectConv,onLogout,onOpenSettings,onEditProfile}) {
  const [search,setSearch]=useState('');
  const [userResults,setUserResults]=useState([]);
  const [showCreate,setShowCreate]=useState(false);
  const [showSelfProfile,setShowSelfProfile]=useState(false);

  const recentUserIds=conversations.filter(c=>c.type==='dm').map(c=>c.peer?.id).filter(Boolean);

  const handleSearch=e=>{
    const q=e.target.value; setSearch(q);
    if(q.length<2){setUserResults([]);return;}
    setUserResults(USERS.filter(u=>u.username.includes(q.toLowerCase())||u.name.toLowerCase().includes(q.toLowerCase())));
  };

  return (
    <>
      <div style={{width:300,minWidth:300,background:'var(--sidebar)',borderRight:'1px solid var(--divider)',display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden',transition:'background .25s'}}>

        {/* Header */}
        <div style={{padding:'18px 16px 12px',borderBottom:'1px solid var(--divider)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{fontSize:17,fontWeight:700,color:'var(--text)',letterSpacing:'-0.03em',display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:20}}>✦</span> Messenger
            </div>
            <div style={{display:'flex',gap:4}}>
              <button onClick={onOpenSettings} title="Настройки"
                style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',padding:7,borderRadius:8,display:'flex',transition:'all .15s'}}
                onMouseEnter={e=>{e.currentTarget.style.background='var(--sidebar-hover)';e.currentTarget.style.color='var(--text)';}}
                onMouseLeave={e=>{e.currentTarget.style.background='none';e.currentTarget.style.color='var(--text-muted)';}}>
                <Ic d={icons.settings} size={17}/>
              </button>
            </div>
          </div>
          <TextInput placeholder="Поиск..." value={search} onChange={handleSearch} icon={<Ic d={icons.search} size={16}/>} style={{fontSize:13,padding:'8px 12px 8px 36px'}}/>
        </div>

        {/* Search results */}
        {userResults.length>0&&(
          <div style={{padding:'8px 8px 4px',borderBottom:'1px solid var(--divider)',animation:'fadeSlideIn .15s ease'}}>
            <div style={{fontSize:11,color:'var(--text-muted)',padding:'2px 6px 6px',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:600}}>Найдено</div>
            {userResults.map(u=>(
              <div key={u.id} onClick={()=>{onSelectConv(u.id);setSearch('');setUserResults([]);}}
                style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:10,cursor:'pointer',transition:'background .12s'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--sidebar-hover)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <Avatar name={u.name} color={u.color} size={34} online={u.online}/>
                <div>
                  <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{u.name}</div>
                  <div style={{fontSize:12,color:'var(--text-muted)'}}>@{u.username}</div>
                </div>
              </div>
            ))}
          </div>
        )}

        {/* Conversations */}
        <div style={{flex:1,overflowY:'auto',padding:'10px 8px 0'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 6px 8px'}}>
            <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'.07em',fontWeight:600}}>Диалоги</div>
            <button onClick={()=>setShowCreate(true)} style={{
              background:'var(--input-bg)',border:'1px solid var(--input-border)',color:'var(--text-muted)',
              cursor:'pointer',borderRadius:7,display:'flex',alignItems:'center',gap:4,padding:'3px 9px',fontSize:12,transition:'all .15s',
            }}
              onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'}
              onMouseLeave={e=>e.currentTarget.style.borderColor='var(--input-border)'}>
              <Ic d={icons.plus} size={14}/> Группа
            </button>
          </div>
          {conversations.map(c=>(
            <ConvItem key={c.id} conv={c} active={c.id===activeId} onClick={()=>onSelectConv(c.id)}/>
          ))}
        </div>

        {/* Profile footer */}
        <div style={{padding:'12px 14px',borderTop:'1px solid var(--divider)',background:'var(--sidebar)',transition:'background .25s'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div onClick={()=>setShowSelfProfile(true)} style={{display:'flex',alignItems:'center',gap:10,flex:1,minWidth:0,cursor:'pointer',borderRadius:10,padding:'4px 6px',transition:'background .15s'}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--sidebar-hover)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <Avatar name={currentUser.name} color={currentUser.color||'var(--accent)'} size={38} online/>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:500,fontSize:13,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{currentUser.name}</div>

  return (
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--chat-bg)',flexDirection:'column',gap:10,transition:'background .25s'}}>
      <div style={{fontSize:52,opacity:0.15,animation:'pulse 3s ease infinite'}}>✦</div>
      <div style={{color:'var(--text-muted)',fontSize:15,fontWeight:500}}>Выберите диалог</div>

    </div>

// ─── Chat App ──────────────────────────────────────────────────────────────
function ChatApp({user,onLogout,theme,setTheme,accent,setAccent,font,setFont}) {
  const [activeId,setActiveId]=useState(null);
  const [allMessages,setAllMessages]=useState(MOCK_MSGS);
  const [convs,setConvs]=useState(MOCK_CONVS);
  const [showSettings,setShowSettings]=useState(false);
  const [showProfile,setShowProfile]=useState(false);
  const [currentUser,setCurrentUser]=useState(user);

  const activeConv=convs.find(c=>c.id===activeId)||null;
  const messages=activeId?(allMessages[activeId]||[]):[];

  const handleSend=(text,id)=>{
    const msg={id,from:'me',text,ts:new Date()};
    setAllMessages(prev=>({...prev,[activeId]:[...(prev[activeId]||[]),msg]}));
    setConvs(prev=>prev.map(c=>c.id===activeId?{...c,lastMsg:text,lastTs:new Date(),unread:0}:c));
  };

  const handleSelect=id=>{
    setActiveId(id);
    setConvs(prev=>prev.map(c=>c.id===id?{...c,unread:0}:c));
    if(id&&!convs.find(c=>c.id===id)){
      const u=USERS.find(u=>u.id===id);
      if(u) setConvs(prev=>[{id:u.id,type:'dm',peer:u,lastMsg:'',lastTs:new Date(),unread:0},...prev]);
    }
  };

  // Apply accent color to CSS
  useEffect(()=>{
    document.documentElement.style.setProperty('--accent',accent);
    document.documentElement.style.setProperty('--accent-hover', adjustAccent(accent));
    document.documentElement.style.setProperty('--bubble-me',accent);
    document.body.style.fontFamily=font;
  },[accent,font]);

  // Apply theme
  useEffect(()=>{
    document.documentElement.className=theme==='light'?'light':'';
  },[theme]);

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar currentUser={currentUser} conversations={convs} activeId={activeId}
        onSelectConv={handleSelect} onLogout={onLogout}
        onOpenSettings={()=>setShowSettings(true)}
        onEditProfile={u=>{setCurrentUser(u);localStorage.setItem('msg_user',JSON.stringify(u));}}/>
      {activeConv
        ? <div style={{flex:1,overflow:'hidden'}}><ChatArea conv={activeConv} currentUser={currentUser} messages={messages} onSend={handleSend} onStartChat={u=>{handleSelect(u.id);}}/></div>
        : <EmptyState/>}
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} font={font} setFont={setFont}/>}
    </div>
  );
}

// Lighten/darken hex for hover
function adjustAccent(hex) {
  try {
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,r+24); g=Math.min(255,g+24); b=Math.min(255,b+24);
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
  } catch { return hex; }
}

// ─── Root ──────────────────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(()=>{try{return JSON.parse(localStorage.getItem('msg_user')||'null');}catch{return null;}});
  const [theme,setTheme]=useState(()=>localStorage.getItem('msg_theme')||'dark');
  const [accent,setAccent]=useState(()=>localStorage.getItem('msg_accent')||TWEAK_DEFAULTS.accent);
  const [font,setFont]=useState(()=>localStorage.getItem('msg_font')||TWEAK_DEFAULTS.font);

  const persistTheme=t=>{setTheme(t);localStorage.setItem('msg_theme',t);};
  const persistAccent=a=>{setAccent(a);localStorage.setItem('msg_accent',a);};
  const persistFont=f=>{setFont(f);localStorage.setItem('msg_font',f);};

  const login=u=>{localStorage.setItem('msg_user',JSON.stringify(u));setUser(u);};
  const logout=()=>{localStorage.removeItem('msg_user');setUser(null);};

  useEffect(()=>{
    document.documentElement.className=theme==='light'?'light':'';
    document.body.style.fontFamily=font;
    document.documentElement.style.setProperty('--accent',accent);
    document.documentElement.style.setProperty('--bubble-me',accent);
  },[]);

  if(!user) return <AuthScreen onLogin={login}/>;
  return (
    <ThemeCtx.Provider value={{theme,setTheme:persistTheme}}>
      <ChatApp user={user} onLogout={logout} theme={theme} setTheme={persistTheme} accent={accent} setAccent={persistAccent} font={font} setFont={persistFont}/>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
// Tweaks panel
window.addEventListener('message',e=>{
  if(e.data?.type==='__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('visible');
  if(e.data?.type==='__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');
});
window.parent.postMessage({type:'__edit_mode_available'},'*');

document.getElementById('tw-accent').addEventListener('input',function(){
  document.documentElement.style.setProperty('--accent',this.value);
  document.documentElement.style.setProperty('--bubble-me',this.value);
  window.parent.postMessage({type:'__edit_mode_set_keys',edits:{accent:this.value}},'*');
});
document.getElementById('tw-font').addEventListener('change',function(){
  document.body.style.fontFamily=this.value;
  window.parent.postMessage({type:'__edit_mode_set_keys',edits:{font:this.value}},'*');
});
</script>
