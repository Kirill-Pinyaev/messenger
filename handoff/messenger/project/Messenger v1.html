<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; font-family: 'Inter', sans-serif; }
  body { background: #0b0b10; color: #e8e8f0; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
  input, textarea, button { font-family: inherit; }

  /* Tweaks panel */
  #tweaks-panel {
    display: none;
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    background: #1a1a2e; border: 1px solid #2e2e4a;
    border-radius: 16px; padding: 20px; width: 240px;
    box-shadow: 0 24px 60px #00000080;
  }
  #tweaks-panel.visible { display: block; }
  #tweaks-panel h4 { font-size: 13px; font-weight: 600; color: #a0a0c0; margin-bottom: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .tweak-row { margin-bottom: 12px; }
  .tweak-row label { display: block; font-size: 12px; color: #7070a0; margin-bottom: 5px; }
  .tweak-row input[type=color] { width: 100%; height: 32px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 0; }
  .tweak-row select { width: 100%; background: #0f0f1a; border: 1px solid #2e2e4a; color: #e8e8f0; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="tweaks-panel">
  <h4>Tweaks</h4>
  <div class="tweak-row">
    <label>Акцентный цвет</label>
    <input type="color" id="tw-accent" value="#7c6fff" />
  </div>
  <div class="tweak-row">
    <label>Шрифт</label>
    <select id="tw-font">
      <option value="Inter">Inter</option>
      <option value="'IBM Plex Sans'">IBM Plex Sans</option>
      <option value="'Space Grotesk'">Space Grotesk</option>
    </select>
  </div>
  <div class="tweak-row">
    <label>Радиус сообщений</label>
    <select id="tw-radius">
      <option value="16px">Мягкий</option>
      <option value="8px">Острый</option>
      <option value="22px">Круглый</option>
    </select>
  </div>
</div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#7c6fff",
  "font": "Inter",
  "msgRadius": "16px"
}/*EDITMODE-END*/;

const { useState, useEffect, useRef, useCallback } = React;

// ─── Helpers ─────────────────────────────────────────────────────────────────
function initials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}
function timeStr(d) {
  return d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}
function dayStr(d) {
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'long' });
}

// ─── Mock data ────────────────────────────────────────────────────────────────
const MOCK_USERS = [
  { id: 'alice', username: 'alice', name: 'Алиса Петрова', color: '#5b8dee', online: true },
  { id: 'bob', username: 'bob', name: 'Боб Смирнов', color: '#ee5b8d', online: false },
  { id: 'carol', username: 'carol', name: 'Карол Иванова', color: '#5beeca', online: true },
  { id: 'dan', username: 'dan', name: 'Даниил Козлов', color: '#eec15b', online: false },
  { id: 'eva', username: 'eva', name: 'Ева Белова', color: '#c45bee', online: true },
];
const NOW = new Date();
const mins = m => new Date(NOW - m * 60000);

const MOCK_MESSAGES = {
  'alice': [
    { id: 1, from: 'alice', text: 'Привет! Как дела?', ts: mins(60) },
    { id: 2, from: 'me', text: 'Всё отлично, спасибо!', ts: mins(58) },
    { id: 3, from: 'alice', text: 'Отправил тебе файлы по проекту.', ts: mins(30) },
    { id: 4, from: 'me', text: 'Принял, изучаю', ts: mins(28) },
    { id: 5, from: 'alice', text: 'Жду фидбек до вечера 🙂', ts: mins(5) },
  ],
  'bob': [
    { id: 1, from: 'bob', text: 'Встреча в 15:00?', ts: mins(120) },
    { id: 2, from: 'me', text: 'Ок, буду', ts: mins(118) },
  ],
  'carol': [
    { id: 1, from: 'carol', text: 'Посмотри дашборд, я поправила цвета', ts: mins(200) },
    { id: 2, from: 'me', text: 'Классно вышло!', ts: mins(195) },
    { id: 3, from: 'carol', text: 'Хочу ещё добавить анимации', ts: mins(10) },
  ],
  'group-1': [
    { id: 1, from: 'alice', text: 'Всем привет!', ts: mins(300) },
    { id: 2, from: 'bob', text: 'Привет команда', ts: mins(295) },
    { id: 3, from: 'me', text: 'Доброе утро!', ts: mins(290) },
    { id: 4, from: 'carol', text: 'Сегодня созвон в 14:00', ts: mins(15) },
  ],
};

const MOCK_CONVS = [
  { id: 'alice', type: 'dm', peer: MOCK_USERS[0], lastMsg: 'Жду фидбек до вечера', lastTs: mins(5), unread: 1 },
  { id: 'group-1', type: 'group', name: 'Команда дизайна', members: [MOCK_USERS[0], MOCK_USERS[1], MOCK_USERS[2]], lastMsg: 'Сегодня созвон в 14:00', lastTs: mins(15), unread: 3 },
  { id: 'bob', type: 'dm', peer: MOCK_USERS[1], lastMsg: 'Ок, буду', lastTs: mins(118), unread: 0 },
  { id: 'carol', type: 'dm', peer: MOCK_USERS[2], lastMsg: 'Хочу ещё добавить анимации', lastTs: mins(10), unread: 2 },
  { id: 'dan', type: 'dm', peer: MOCK_USERS[3], lastMsg: 'Спасибо!', lastTs: mins(2000), unread: 0 },
];

// ─── Design tokens (controlled by tweaks) ────────────────────────────────────
const BASE = {
  bg: '#0b0b10',
  sidebar: '#0f0f18',
  sidebarHover: '#161624',
  panel: '#13131e',
  panelBorder: '#1e1e30',
  chatBg: '#0d0d16',
  bubble: '#1a1a2e',
  bubbleMe: '#7c6fff',
  input: '#181828',
  inputBorder: '#252540',
  text: '#e8e8f0',
  textMuted: '#7070a0',
  textSoft: '#a0a0c8',
  accent: '#7c6fff',
  accentHover: '#9380ff',
  danger: '#ff5b5b',
  online: '#3be8a0',
  divider: '#1a1a2c',
};

// ─── SVG Icons ────────────────────────────────────────────────────────────────
const Icon = ({ d, size = 18, color = 'currentColor', style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}>
    <path d={d} />
  </svg>
);
const SearchIcon = () => <Icon d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />;
const SendIcon = () => <Icon d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" />;
const EditIcon = () => <Icon d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />;
const LogoutIcon = () => <Icon d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />;
const PlusIcon = () => <Icon d="M12 5v14M5 12h14" size={16} />;
const CloseIcon = () => <Icon d="M18 6L6 18M6 6l12 12" size={16} />;
const CheckIcon = () => <Icon d="M20 6L9 17l-5-5" size={14} />;
const UserIcon = () => <Icon d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" size={16} />;
const GroupIcon = () => <Icon d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" size={16} />;

// ─── Avatar ───────────────────────────────────────────────────────────────────
function Avatar({ name, color, size = 38, online = false }) {
  return (
    <div style={{ position: 'relative', flexShrink: 0 }}>
      <div style={{
        width: size, height: size, borderRadius: '50%',
        background: color || BASE.accent,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontSize: size * 0.36, fontWeight: 600, color: '#fff', letterSpacing: '-0.02em',
        userSelect: 'none',
      }}>{initials(name)}</div>
      {online && (
        <div style={{
          position: 'absolute', bottom: 1, right: 1,
          width: size * 0.28, height: size * 0.28, borderRadius: '50%',
          background: BASE.online, border: `2px solid ${BASE.sidebar}`,
        }} />
      )}
    </div>
  );
}

// ─── Button ───────────────────────────────────────────────────────────────────
function Btn({ children, onClick, variant = 'primary', style = {}, disabled = false, small = false }) {
  const [hover, setHover] = useState(false);
  const base = {
    display: 'inline-flex', alignItems: 'center', gap: 6,
    border: 'none', cursor: disabled ? 'not-allowed' : 'pointer',
    borderRadius: 10, fontWeight: 500, transition: 'all .15s',
    fontSize: small ? 13 : 14, padding: small ? '6px 12px' : '10px 18px',
    opacity: disabled ? 0.5 : 1,
    transform: hover && !disabled ? 'translateY(-1px)' : 'none',
  };
  const variants = {
    primary: { background: hover ? BASE.accentHover : BASE.accent, color: '#fff' },
    ghost: { background: hover ? BASE.sidebarHover : 'transparent', color: BASE.textSoft },
    danger: { background: hover ? '#ff7070' : BASE.danger, color: '#fff' },
    subtle: { background: hover ? BASE.inputBorder : BASE.input, color: BASE.textSoft },
  };
  return (
    <button
      onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{ ...base, ...variants[variant], ...style }}
    >{children}</button>
  );
}

// ─── Input ────────────────────────────────────────────────────────────────────
function Input({ placeholder, value, onChange, type = 'text', autoFocus = false, style = {} }) {
  const [focus, setFocus] = useState(false);
  return (
    <input
      type={type} placeholder={placeholder} value={value} onChange={onChange}
      autoFocus={autoFocus}
      onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
      style={{
        width: '100%', background: BASE.input,
        border: `1px solid ${focus ? BASE.accent : BASE.inputBorder}`,
        borderRadius: 10, padding: '10px 14px', color: BASE.text,
        fontSize: 14, outline: 'none', transition: 'border .15s',
        '::placeholder': { color: BASE.textMuted }, ...style,
      }}
    />
  );
}

// ─── Auth Screen ──────────────────────────────────────────────────────────────
function AuthScreen({ onLogin }) {
  const [tab, setTab] = useState('login');
  const [form, setForm] = useState({ username: '', password: '', firstName: '', lastName: '', passwordRepeat: '' });
  const [error, setError] = useState('');

  const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

  const submit = () => {
    if (!form.username || !form.password) { setError('Заполните все поля'); return; }
    if (tab === 'register' && form.password !== form.passwordRepeat) { setError('Пароли не совпадают'); return; }
    onLogin({ username: form.username, name: form.firstName ? `${form.firstName} ${form.lastName}` : form.username });
  };

  return (
    <div style={{
      minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: `radial-gradient(ellipse 900px 600px at 20% 30%, #1a1040 0%, transparent 60%),
                   radial-gradient(ellipse 700px 500px at 80% 70%, #0d1a3a 0%, transparent 60%),
                   ${BASE.bg}`,
      padding: 24,
    }}>
      <div style={{
        width: 'min(440px,100%)',
        background: 'linear-gradient(135deg, #13131e 0%, #0f0f18 100%)',
        border: `1px solid ${BASE.panelBorder}`,
        borderRadius: 24, padding: 36,
        boxShadow: '0 32px 80px #00000090',
      }}>
        {/* Logo */}
        <div style={{ marginBottom: 32, textAlign: 'center' }}>
          <div style={{
            width: 56, height: 56, borderRadius: 16, background: BASE.accent,
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 16, fontSize: 24,
          }}>✦</div>
          <div style={{ fontSize: 22, fontWeight: 700, color: BASE.text }}>Messenger</div>
          <div style={{ fontSize: 13, color: BASE.textMuted, marginTop: 4 }}>gRPC-Web клиент</div>
        </div>

        {/* Tabs */}
        <div style={{
          display: 'grid', gridTemplateColumns: '1fr 1fr',
          background: BASE.input, borderRadius: 12, padding: 4, marginBottom: 24,
        }}>
          {['login','register'].map(t => (
            <button key={t} onClick={() => { setTab(t); setError(''); }}
              style={{
                border: 'none', cursor: 'pointer', borderRadius: 9, padding: '8px 0',
                fontWeight: 500, fontSize: 14, transition: 'all .15s',
                background: tab === t ? BASE.accent : 'transparent',
                color: tab === t ? '#fff' : BASE.textMuted,
              }}
            >{t === 'login' ? 'Вход' : 'Регистрация'}</button>
          ))}
        </div>

        {/* Form */}
        <div style={{ display: 'grid', gap: 12 }}>
          {tab === 'register' && (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <Input placeholder="Имя" value={form.firstName} onChange={set('firstName')} />
              <Input placeholder="Фамилия" value={form.lastName} onChange={set('lastName')} />
            </div>
          )}
          <Input placeholder="Никнейм" value={form.username} onChange={set('username')} autoFocus />
          <Input placeholder="Пароль" type="password" value={form.password} onChange={set('password')} />
          {tab === 'register' && (
            <Input placeholder="Повторите пароль" type="password" value={form.passwordRepeat} onChange={set('passwordRepeat')} />
          )}
          {error && <div style={{ fontSize: 13, color: BASE.danger, textAlign: 'center' }}>{error}</div>}
          <Btn onClick={submit} style={{ width: '100%', justifyContent: 'center', marginTop: 4 }}>
            {tab === 'login' ? 'Войти' : 'Создать аккаунт'}
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ─── Conversation Item ────────────────────────────────────────────────────────
function ConvItem({ conv, active, onClick, currentUser }) {
  const [hover, setHover] = useState(false);
  const isGroup = conv.type === 'group';
  const name = isGroup ? conv.name : conv.peer.name;
  const color = isGroup ? '#5b8dee' : conv.peer.color;
  const online = isGroup ? false : conv.peer.online;
  const bg = active ? `${BASE.accent}22` : hover ? BASE.sidebarHover : 'transparent';
  const border = active ? `1px solid ${BASE.accent}44` : '1px solid transparent';

  return (
    <div onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        display: 'flex', alignItems: 'center', gap: 12,
        padding: '10px 12px', borderRadius: 12, cursor: 'pointer',
        background: bg, border, transition: 'all .15s', userSelect: 'none',
      }}>
      <Avatar name={name} color={color} size={42} online={online} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <div style={{ fontSize: 14, fontWeight: 500, color: active ? BASE.accent : BASE.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {isGroup && <GroupIcon />}{' '}{name}
          </div>
          <div style={{ fontSize: 11, color: BASE.textMuted, flexShrink: 0, marginLeft: 8 }}>
            {timeStr(conv.lastTs)}
          </div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 2 }}>
          <div style={{ fontSize: 13, color: BASE.textMuted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 160 }}>
            {conv.lastMsg}
          </div>
          {conv.unread > 0 && (
            <div style={{
              background: BASE.accent, color: '#fff', fontSize: 11, fontWeight: 600,
              borderRadius: 10, padding: '1px 7px', flexShrink: 0, marginLeft: 6,
            }}>{conv.unread}</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Message Bubble ───────────────────────────────────────────────────────────
function Bubble({ msg, isMe, senderName, senderColor, showSender, msgRadius }) {
  return (
    <div style={{
      display: 'flex', flexDirection: isMe ? 'row-reverse' : 'row',
      gap: 8, marginBottom: 6, alignItems: 'flex-end',
    }}>
      {!isMe && (
        <Avatar name={senderName} color={senderColor} size={30} />
      )}
      <div style={{ maxWidth: '65%' }}>
        {showSender && !isMe && (
          <div style={{ fontSize: 12, color: senderColor, fontWeight: 500, marginBottom: 3, marginLeft: 4 }}>
            {senderName}
          </div>
        )}
        <div style={{
          background: isMe ? BASE.accent : BASE.bubble,
          color: isMe ? '#fff' : BASE.text,
          padding: '9px 14px', borderRadius: msgRadius,
          borderBottomRightRadius: isMe ? 4 : msgRadius,
          borderBottomLeftRadius: !isMe ? 4 : msgRadius,
          fontSize: 14, lineHeight: 1.5,
          boxShadow: '0 2px 8px #00000030',
        }}>
          {msg.text}
          <div style={{ fontSize: 11, color: isMe ? 'rgba(255,255,255,0.6)' : BASE.textMuted, textAlign: 'right', marginTop: 3 }}>
            {timeStr(msg.ts)} {isMe && <CheckIcon />}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Chat Area ────────────────────────────────────────────────────────────────
function ChatArea({ conv, currentUser, messages, onSend, msgRadius }) {
  const [text, setText] = useState('');
  const bottomRef = useRef();
  const isGroup = conv.type === 'group';
  const name = isGroup ? conv.name : conv.peer.name;
  const color = isGroup ? '#5b8dee' : conv.peer.color;
  const online = isGroup ? false : conv.peer.online;
  const subtitle = isGroup
    ? `${conv.members.length} участника`
    : (online ? 'в сети' : 'не в сети');

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const send = () => {
    if (!text.trim()) return;
    onSend(text.trim());
    setText('');
  };

  const handleKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  // Group messages by date
  let lastDate = null;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', background: BASE.chatBg }}>
      {/* Header */}
      <div style={{
        padding: '14px 20px', borderBottom: `1px solid ${BASE.divider}`,
        display: 'flex', alignItems: 'center', gap: 12,
        background: BASE.panel, backdropFilter: 'blur(8px)',
      }}>
        <Avatar name={name} color={color} size={40} online={online} />
        <div>
          <div style={{ fontWeight: 600, fontSize: 15, color: BASE.text }}>{name}</div>
          <div style={{ fontSize: 12, color: online ? BASE.online : BASE.textMuted }}>{subtitle}</div>
        </div>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '20px 20px 8px' }}>
        {messages.map((msg, i) => {
          const d = dayStr(msg.ts);
          const showDate = d !== lastDate;
          lastDate = d;
          const isMe = msg.from === 'me';
          const sender = MOCK_USERS.find(u => u.id === msg.from) || { name: msg.from, color: BASE.accent };
          const showSender = isGroup && !isMe && (i === 0 || messages[i-1].from !== msg.from);

          return (
            <React.Fragment key={msg.id}>
              {showDate && (
                <div style={{ textAlign: 'center', marginBottom: 16, marginTop: 8 }}>
                  <span style={{
                    fontSize: 12, color: BASE.textMuted, background: BASE.input,
                    padding: '3px 12px', borderRadius: 20,
                  }}>{d}</span>
                </div>
              )}
              <Bubble
                msg={msg} isMe={isMe}
                senderName={isMe ? currentUser.name : sender.name}
                senderColor={sender.color}
                showSender={showSender}
                msgRadius={msgRadius}
              />
            </React.Fragment>
          );
        })}
        <div ref={bottomRef} />
      </div>

      {/* Input */}
      <div style={{ padding: '12px 16px', background: BASE.panel, borderTop: `1px solid ${BASE.divider}` }}>
        <div style={{
          display: 'flex', gap: 10, alignItems: 'flex-end',
          background: BASE.input, border: `1px solid ${BASE.inputBorder}`,
          borderRadius: 14, padding: '8px 8px 8px 14px',
        }}>
          <textarea
            value={text} onChange={e => setText(e.target.value)} onKeyDown={handleKey}
            placeholder="Написать сообщение..."
            rows={1}
            style={{
              flex: 1, background: 'transparent', border: 'none', outline: 'none',
              color: BASE.text, fontSize: 14, resize: 'none', lineHeight: 1.5,
              maxHeight: 120, overflowY: 'auto', padding: '2px 0',
            }}
          />
          <button onClick={send}
            style={{
              background: text.trim() ? BASE.accent : BASE.inputBorder,
              border: 'none', cursor: text.trim() ? 'pointer' : 'default',
              borderRadius: 10, width: 36, height: 36,
              display: 'flex', alignItems: 'center', justifyContent: 'center',

// ─── Main Chat App ────────────────────────────────────────────────────────────
function ChatApp({ user, onLogout }) {
  const [activeId, setActiveId] = useState(null);
  const [allMessages, setAllMessages] = useState(MOCK_MESSAGES);
  const [convs, setConvs] = useState(MOCK_CONVS);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  const activeConv = convs.find(c => c.id === activeId) || null;
  const messages = activeId ? (allMessages[activeId] || []) : [];

  const handleSend = text => {
    const newMsg = { id: Date.now(), from: 'me', text, ts: new Date() };
    setAllMessages(prev => ({ ...prev, [activeId]: [...(prev[activeId] || []), newMsg] }));
    setConvs(prev => prev.map(c => c.id === activeId ? { ...c, lastMsg: text, lastTs: new Date(), unread: 0 } : c));
  };

  const handleSelect = id => {
    setActiveId(id);
    setConvs(prev => prev.map(c => c.id === id ? { ...c, unread: 0 } : c));
    if (id && !convs.find(c => c.id === id)) {
      const u = MOCK_USERS.find(u => u.id === id);
      if (u) {
        setConvs(prev => [{ id: u.id, type: 'dm', peer: u, lastMsg: '', lastTs: new Date(), unread: 0 }, ...prev]);
      }
    }
  };

  // Apply tweaks to CSS vars
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent || BASE.accent);
    document.body.style.fontFamily = tweaks.font;
  }, [tweaks]);

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
      <Sidebar
        currentUser={user} conversations={convs} activeId={activeId}
        onSelectConv={handleSelect} onLogout={onLogout}
      />
      {activeConv
        ? <div style={{ flex: 1, overflow: 'hidden' }}>
            <ChatArea
              conv={activeConv} currentUser={user} messages={messages}
              onSend={handleSend} msgRadius={tweaks.msgRadius || BASE.msgRadius || '16px'}
            />
          </div>
        : <EmptyState />
      }
    </div>
  );
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem('msg_user') || 'null'); } catch { return null; }
  });

  const login = u => {
    localStorage.setItem('msg_user', JSON.stringify(u));
    setUser(u);
  };
  const logout = () => {
    localStorage.removeItem('msg_user');
    setUser(null);
  };

  if (!user) return <AuthScreen onLogin={login} />;
  return <ChatApp user={user} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

<script>
// Tweaks integration
const DEFAULTS = { accent: '#7c6fff', font: 'Inter', msgRadius: '16px' };
let editActive = false;

window.addEventListener('message', e => {
  if (e.data?.type === '__activate_edit_mode') {
    editActive = true;
    document.getElementById('tweaks-panel').classList.add('visible');
  }
  if (e.data?.type === '__deactivate_edit_mode') {
    editActive = false;
    document.getElementById('tweaks-panel').classList.remove('visible');
  }
});

window.parent.postMessage({ type: '__edit_mode_available' }, '*');

document.getElementById('tw-accent').addEventListener('input', function() {
  document.documentElement.style.setProperty('--accent', this.value);
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: this.value } }, '*');
});
document.getElementById('tw-font').addEventListener('change', function() {
  document.body.style.fontFamily = this.value;
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { font: this.value } }, '*');
});
document.getElementById('tw-radius').addEventListener('change', function() {
  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { msgRadius: this.value } }, '*');
});
</script>
