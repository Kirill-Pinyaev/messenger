syntax = "proto3";

package messenger.v1;

option go_package = "messenger/gen/messenger/v1;messengerv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (google.protobuf.Empty);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc DeleteAccount(google.protobuf.Empty) returns (google.protobuf.Empty);
}

service UserService {
  rpc GetProfile(GetProfileRequest) returns (Profile);
  rpc UpdateProfile(UpdateProfileRequest) returns (Profile);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc ListConversations(google.protobuf.Empty) returns (ListConversationsResponse);
  rpc CreateGroupConversation(CreateGroupConversationRequest) returns (Conversation);
  rpc AddGroupMembers(AddGroupMembersRequest) returns (Conversation);
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (Conversation);
  rpc LeaveGroupConversation(LeaveGroupConversationRequest) returns (google.protobuf.Empty);
  rpc TransferGroupAdmin(TransferGroupAdminRequest) returns (Conversation);
}

service MessageService {
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);
  rpc StreamEvents(StreamEventsRequest) returns (stream ServerEvent);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  string avatar_hex = 5;
  string avatar_data = 6;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message Profile {
  string username = 1;
  string first_name = 2;
  string last_name = 3;
  string avatar_hex = 4;
  string avatar_data = 5;
}

message GetProfileRequest {
  string username = 1;
}

message UpdateProfileRequest {
  string first_name = 1;
  string last_name = 2;
  string avatar_hex = 3;
  string avatar_data = 4;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchUsersResponse {
  repeated Profile items = 1;
}

message Conversation {
  string conversation_id = 1;
  string peer_username = 2;
  Profile peer_profile = 3;
  ConversationKind kind = 4;
  string title = 5;
  repeated string member_usernames = 6;
  repeated ConversationMember members = 7;
}

message ListConversationsResponse {
  repeated Conversation items = 1;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

message CreateGroupConversationRequest {
  string title = 1;
  repeated string member_usernames = 2;
}

message AddGroupMembersRequest {
  string conversation_id = 1;
  repeated string member_usernames = 2;
}

message RemoveGroupMemberRequest {
  string conversation_id = 1;
  string username = 2;
}

message LeaveGroupConversationRequest {
  string conversation_id = 1;
}

message TransferGroupAdminRequest {
  string conversation_id = 1;
  string username = 2;
}

enum ConversationRole {
  CONVERSATION_ROLE_UNSPECIFIED = 0;
  CONVERSATION_ROLE_ADMIN = 1;
  CONVERSATION_ROLE_MEMBER = 2;
}

message ConversationMember {
  string username = 1;
  ConversationRole role = 2;
  string added_by = 3;
}

message Message {
  int64 message_id = 1;
  string conversation_id = 2;
  string from = 3;
  string to = 4;
  string text = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SendMessageRequest {
  string to = 1;
  string text = 2;
  string conversation_id = 3;
}

message GetMessagesRequest {
  string conversation_id = 1;
  string with_username = 2;
  int32 limit = 3;
}

message GetMessagesResponse {
  repeated Message items = 1;
}

message SearchMessagesRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchMessagesResponse {
  repeated Message items = 1;
}

message DeleteMessageRequest {
  int64 message_id = 1;
}

message StreamEventsRequest {}

message PresenceEvent {
  repeated string online_users = 1;
}

message ProfileEvent {
  Profile profile = 1;
}

message MessageDeletedEvent {
  int64 message_id = 1;
  string conversation_id = 2;
}

message ConversationRemovedEvent {
  string conversation_id = 1;
}

message ServerEvent {
  google.protobuf.Timestamp created_at = 1;
  oneof payload {
    PresenceEvent presence = 2;
    Message message = 3;
    ProfileEvent profile = 4;
    MessageDeletedEvent message_deleted = 5;
    Conversation conversation = 6;
    ConversationRemovedEvent conversation_removed = 7;
  }
}
