<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Мини-мессенджер</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fffdfa;
      --panel-2: #f6f0e6;
      --panel-3: #f8f4ec;
      --ink: #1b1b1b;
      --muted: #6b6b6b;
      --accent: #23685b;
      --accent-2: #c25b39;
      --accent-3: #3b6cde;
      --accent-4: #f2b544;
      --accent-5: #e96aa3;
      --line: #e5dfd3;
      --chip: #f4eee3;
      --shadow: 0 18px 40px rgba(18, 20, 19, 0.08);
      font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1417;
      --panel: #141b1f;
      --panel-2: #192228;
      --panel-3: #1c262d;
      --ink: #f2f2f2;
      --muted: #a6b0b6;
      --accent: #31a18b;
      --accent-2: #d67d54;
      --accent-3: #6c8dff;
      --accent-4: #f0c15e;
      --accent-5: #f082b6;
      --line: #233039;
      --chip: #1c262d;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 0% 0%, rgba(255, 246, 231, 0.9) 0%, transparent 60%),
        radial-gradient(1000px 500px at 100% 20%, rgba(231, 242, 239, 0.9) 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    [data-theme="dark"] body {
      background:
        radial-gradient(1200px 600px at 0% 0%, rgba(36, 60, 59, 0.45) 0%, transparent 60%),
        radial-gradient(1000px 500px at 100% 20%, rgba(35, 46, 66, 0.5) 0%, transparent 60%),
        var(--bg);
    }
    header { padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); position: relative; z-index: 2; }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.3px; }
    .muted { color: var(--muted); }
    .app { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 86px); overflow: hidden; }
    aside { border-right: 1px solid var(--line); background: var(--panel-2); padding: 14px; overflow: auto; box-shadow: inset -1px 0 0 rgba(0,0,0,0.02); }
    main { padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button, textarea { padding: 9px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    input:focus, textarea:focus { outline: 2px solid rgba(35, 104, 91, 0.2); border-color: rgba(35, 104, 91, 0.5); }
    button { background: var(--accent); color: white; border: none; cursor: pointer; box-shadow: 0 6px 16px rgba(35, 104, 91, 0.2); transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease; }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(35, 104, 91, 0.25); }
    button.secondary { background: #2b2b2b; box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
    button.danger { background: #b00020; box-shadow: 0 6px 16px rgba(176,0,32,0.25); }
    button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .list button { text-align: left; background: transparent; color: var(--ink); border: 1px solid transparent; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; }
    .list button.active { background: #eef4f2; border-color: #d3e5df; }
    .list button:hover { background: #f4f2ed; border-color: #e4ddd1; }
    [data-theme="dark"] .list button.active { background: #1d2b30; border-color: #274049; }
    [data-theme="dark"] .list button:hover { background: #1a252b; border-color: #2a3a42; }
    .log { flex: 1; min-height: 0; border: 1px solid var(--line); background: var(--panel-3); padding: 12px; border-radius: 14px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
    .log .err { color: #b00020; }
    .log .muted { color: var(--muted); }
    .msg { max-width: 70%; padding: 10px 12px; border-radius: 14px; background: #f3efe7; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; box-shadow: 0 6px 12px rgba(0,0,0,0.05); animation: pop 200ms ease; position: relative; }
    .msg.in { align-self: flex-start; }
    .msg.out { align-self: flex-end; background: #cfe8e2; }
    [data-theme="dark"] .msg { background: #1a2328; box-shadow: 0 8px 14px rgba(0,0,0,0.35); }
    [data-theme="dark"] .msg.out { background: #1d3a35; }
    .msg.hit { outline: 2px solid #f1b21b; background: #fff4cf; }
    .msg.selected { outline: 2px solid #2b6cb0; background: #d7e7ff; }
    .composer { width: 100%; min-height: 44px; max-height: 120px; resize: vertical; overflow: auto; }
    .online { color: var(--accent); font-size: 12px; }
    .badge { display: inline-block; min-width: 18px; padding: 2px 6px; border-radius: 999px; background: var(--accent-2); color: #fff; font-size: 12px; text-align: center; margin-left: 6px; }
    .modal { position: fixed; inset: 0; background: rgba(22, 22, 22, 0.5); display: none; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(4px); }
    .modal.open { display: flex; }
    .modal .card { width: min(520px, 94vw); background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); animation: rise 200ms ease; }
    .modal .list { max-height: 45vh; overflow: auto; }
    .actions { display: none; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    .actions.show { display: flex; }
    .actions .danger { background: #b00020; }
    .push-right { margin-left: auto; }
    .hidden { display: none !important; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #ddd; display: inline-block; background-size: cover; background-position: center; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .avatar.xl { width: 72px; height: 72px; }
    .avatar.clickable { cursor: pointer; }
    .name { font-weight: 600; letter-spacing: 0.2px; }
    .pill { display: inline-block; padding: 2px 6px; border-radius: 999px; background: var(--chip); font-size: 12px; }
    .theme-toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px; background: var(--panel-2); cursor: pointer; }
    .theme-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-5); }
    .fade-in { animation: fadeIn 200ms ease; }
    .composer { transition: box-shadow 120ms ease; }
    .composer:focus { box-shadow: 0 12px 24px rgba(35, 104, 91, 0.15); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-4); display: inline-block; }
    .message-sent { animation: send 260ms ease; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pop { from { transform: scale(0.98); opacity: 0.8; } to { transform: scale(1); opacity: 1; } }
    @keyframes send { from { transform: translateX(8px); opacity: 0.6; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0.6; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; height: auto; }
      aside { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Учебный мессенджер</h1>
    <div class="row">
      <span class="pill" id="status"><span class="status-dot" id="statusDot"></span> disconnected</span>
      <button id="themeToggle" class="theme-toggle secondary"><span class="theme-dot"></span> Night</button>
      <button id="profileBtn" class="secondary push-right">Профиль</button>
    </div>
  </header>

  <section class="app">
    <aside>
      <div class="muted">Поиск</div>
      <input id="search" placeholder="текст или @ник" />
      <div class="list" id="searchResults"></div>

      <hr />

      <div class="muted">Диалоги</div>
      <div class="list" id="conversations"></div>
    </aside>

    <main>
      <div class="row">
        <div id="peerHeader" class="row">
          <div id="peerAvatar" class="avatar clickable"></div>
          <div>
            <div id="peerName" class="name">-</div>
            <span id="peerStatus" class="online"></span>
          </div>
        </div>
        <button id="chatSearchBtn" class="secondary push-right">Поиск</button>
      </div>

      <div class="log" id="log"></div>

      <div id="messageActions" class="actions">
        <button id="actionDelete" class="danger">Удалить</button>
        <button id="actionReply" class="secondary">Ответить</button>
        <button id="actionForward" class="secondary">Переслать</button>
        <button id="actionCopy" class="secondary">Скопировать</button>
        <button id="deleteMine" class="secondary hidden">Удалить у себя</button>
        <button id="deleteAll" class="danger hidden">Удалить у всех</button>
      </div>

      <div class="row">
        <label>Текст:</label>
        <textarea id="text" class="composer" placeholder="привет"></textarea>
        <button id="send" disabled>Отправить</button>
      </div>
    </main>
  </section>

  <div class="modal" id="chatSearchModal">
    <div class="card">
      <h3 style="margin: 0 0 8px;">Поиск в чате</h3>
      <input id="chatSearchInput" placeholder="введите текст" />
      <div class="list" id="chatSearchResults"></div>
      <div class="row" style="margin-top: 8px;">
        <button id="chatSearchClose" class="secondary">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal" id="forwardModal">
    <div class="card">
      <h3 style="margin: 0 0 8px;">Переслать в диалог</h3>
      <div class="list" id="forwardList"></div>
      <div class="row" style="margin-top: 8px;">
        <button id="forwardClose" class="secondary">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal" id="profileModal">
    <div class="card">
      <h3 style="margin: 0 0 8px;">Профиль</h3>
      <div class="row">
        <div id="profileAvatar" class="avatar xl clickable"></div>
      </div>
      <div style="margin-top: 10px;">
        <div class="name" id="profileFirstNameText"></div>
        <div class="name" id="profileLastNameText"></div>
        <div class="muted" id="profileUsername"></div>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="profileEditBtn" class="secondary">Редактировать</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="profileLogout" class="secondary">Выйти</button>
        <button id="profileDelete" class="danger">Удалить аккаунт</button>
        <button id="profileClose" class="secondary push-right">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal" id="profileEditModal">
    <div class="card">
      <h3 style="margin: 0 0 8px;">Редактировать профиль</h3>
      <div class="row">
        <input id="profileFirstName" placeholder="Имя" />
        <input id="profileLastName" placeholder="Фамилия" />
      </div>
      <div class="row" style="margin-top: 8px;">
        <button id="profileSave">Сохранить</button>
        <button id="profileCancel" class="secondary">Отмена</button>
      </div>
    </div>
  </div>

  <div class="modal" id="avatarCropModal">
    <div class="card">
      <h3 style="margin: 0 0 8px;">Выбор аватарки</h3>
      <canvas id="avatarCanvas" width="320" height="320" style="border-radius: 12px; background: #f0f0f0;"></canvas>
      <div class="row" style="margin-top: 8px;">
        <button id="avatarApply">Ок</button>
        <button id="avatarCancel" class="secondary">Отмена</button>
      </div>
    </div>
  </div>

  <input id="avatarFile" type="file" accept="image/*" style="display:none;" />

<script>
(() => {
  const logEl = document.getElementById("log");
  const conversationsEl = document.getElementById("conversations");
  const statusEl = document.getElementById("status");
  const statusDot = document.getElementById("statusDot");
  const themeToggle = document.getElementById("themeToggle");
  const peerNameEl = document.getElementById("peerName");
  const peerAvatarEl = document.getElementById("peerAvatar");
  const peerStatusEl = document.getElementById("peerStatus");
  const chatSearchBtn = document.getElementById("chatSearchBtn");
  const profileBtn = document.getElementById("profileBtn");
  const searchEl = document.getElementById("search");
  const searchResultsEl = document.getElementById("searchResults");
  const chatSearchModal = document.getElementById("chatSearchModal");
  const chatSearchInput = document.getElementById("chatSearchInput");
  const chatSearchResults = document.getElementById("chatSearchResults");
  const chatSearchClose = document.getElementById("chatSearchClose");
  const forwardModal = document.getElementById("forwardModal");
  const forwardList = document.getElementById("forwardList");
  const forwardClose = document.getElementById("forwardClose");
  const profileModal = document.getElementById("profileModal");
  const profileAvatarEl = document.getElementById("profileAvatar");
  const profileFirstNameText = document.getElementById("profileFirstNameText");
  const profileLastNameText = document.getElementById("profileLastNameText");
  const profileUsernameEl = document.getElementById("profileUsername");
  const profileFirstNameEl = document.getElementById("profileFirstName");
  const profileLastNameEl = document.getElementById("profileLastName");
  const profileSaveBtn = document.getElementById("profileSave");
  const profileCancelBtn = document.getElementById("profileCancel");
  const profileCloseBtn = document.getElementById("profileClose");
  const profileLogoutBtn = document.getElementById("profileLogout");
  const profileDeleteBtn = document.getElementById("profileDelete");
  const profileEditBtn = document.getElementById("profileEditBtn");
  const profileEditModal = document.getElementById("profileEditModal");
  const avatarFile = document.getElementById("avatarFile");
  const avatarCropModal = document.getElementById("avatarCropModal");
  const avatarCanvas = document.getElementById("avatarCanvas");
  const avatarApply = document.getElementById("avatarApply");
  const avatarCancel = document.getElementById("avatarCancel");
  const messageActions = document.getElementById("messageActions");
  const actionDelete = document.getElementById("actionDelete");
  const actionReply = document.getElementById("actionReply");
  const actionForward = document.getElementById("actionForward");
  const actionCopy = document.getElementById("actionCopy");
  const deleteMine = document.getElementById("deleteMine");
  const deleteAll = document.getElementById("deleteAll");

  const textEl = document.getElementById("text");
  const sendBtn = document.getElementById("send");

  let ws = null;
  let token = null;
  let me = null;
  let activeConversation = null;
  let activePeer = null;
  const messagesByConv = new Map();
  const onlineUsers = new Set();
  let lastSearchResults = [];
  let lastSearchMode = "";
  let highlightKey = null;
  let pendingHighlight = null;
  const selectedMessages = new Map();
  const userProfiles = new Map();
  const conversationMeta = new Map();
  const unreadCounts = new Map();
  let profileAvatarData = "";
  let cropState = null;
  const messageStatus = new Map();

  function log(line, cls = "") {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = line;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function conversationId(a, b) {
    return [a, b].sort().join("|");
  }

  function messageKey(msg) {
    const id = msg.message_id || msg.id || 0;
    if (id) return String(id);
    const ts = msg.ts || msg.TS || "";
    return [msg.conversation_id || msg.conversationId || "", msg.from || "", msg.to || "", ts, msg.text || ""].join("|");
  }

  function displayName(username) {
    if (!username) return "";
    const profile = userProfiles.get(username);
    if (!profile) return username;
    const full = `${profile.firstName || ""} ${profile.lastName || ""}`.trim();
    return full || username;
  }

  function setAvatar(el, hex, dataUrl) {
    const color = hex ? `#${hex.replace("#", "")}` : "#d0d0d0";
    if (dataUrl) {
      el.style.backgroundImage = `url("${dataUrl}")`;
      el.style.backgroundColor = color;
      return;
    }
    el.style.backgroundImage = "";
    el.style.backgroundColor = color;
  }

  function setStatus(text) {
    statusEl.innerHTML = `<span class="status-dot" id="statusDot"></span> ${text}`;
    const dot = statusEl.querySelector(".status-dot");
    if (dot) {
      dot.style.background = text === "connected" ? "var(--accent)" : "var(--accent-4)";
    }
  }

  function hydrateAuth() {
    token = localStorage.getItem("token");
    me = localStorage.getItem("username");
    if (!token || !me) {
      location.href = "/login.html";
      return false;
    }
    return true;
  }

  async function loadConversations() {
    if (!token) return;
    const res = await fetch("/conversations", {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (res.status === 401) {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      location.href = "/login.html";
      return;
    }
    if (!res.ok) {
      log(`[conversations] failed`, "err");
      return;
    }
    const data = await res.json();
    const items = data.items || [];
    items.forEach((item) => {
      if (!messagesByConv.has(item.conversation_id)) {
        messagesByConv.set(item.conversation_id, []);
      }
      unreadCounts.set(item.conversation_id, 0);
      conversationMeta.set(item.conversation_id, {
        username: item.peer_username,
        firstName: item.first_name || "",
        lastName: item.last_name || "",
        avatarHex: item.avatar_hex || "",
        avatarData: item.avatar_data || "",
      });
      if (item.peer_username) {
        userProfiles.set(item.peer_username, {
          firstName: item.first_name || "",
          lastName: item.last_name || "",
          avatarHex: item.avatar_hex || "",
          avatarData: item.avatar_data || "",
        });
      }
    });
    renderConversations();
    if (!activeConversation && items.length > 0) {
      setActiveConversation(items[0].conversation_id);
    }
  }

  function connectWS() {
    if (!token) return;

    const wsProto = location.protocol === "https:" ? "wss" : "ws";
    const wsUrl = `${wsProto}://${location.host}/ws?token=${encodeURIComponent(token)}`;
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      setStatus("connected");
      sendBtn.disabled = false;
      log(`[connected] ${wsUrl}`, "muted");
    };

    ws.onclose = () => {
      setStatus("disconnected");
      sendBtn.disabled = true;
      log(`[disconnected]`, "muted");
    };

    ws.onerror = () => log(`[ws error]`, "err");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      if (msg.type === "presence") {
        setOnlineUsers(msg.users || []);
        return;
      }

      if (msg.type === "dm") {
        addMessage(msg);
        return;
      }

      if (msg.type === "deleted") {
        handleDeleted(msg);
        return;
      }

      if (msg.type === "delivered") {
        if (msg.message_id) {
          messageStatus.set(String(msg.message_id), "delivered");
          if (activeConversation) {
            renderConversation(activeConversation);
          }
        }
        return;
      }

      if (msg.type === "profile" && msg.profile) {
        applyProfileUpdate(msg.profile);
        return;
      }

      if (msg.type === "history") {
        const list = msg.messages || [];
        messagesByConv.set(msg.conversation_id, list);
        if (activeConversation === msg.conversation_id) {
          if (pendingHighlight && pendingHighlight.convId === msg.conversation_id) {
            highlightKey = pendingHighlight.key;
            pendingHighlight = null;
          }
          renderConversation(activeConversation);
        }
        return;
      }

      if (msg.type === "error") {
        log(`[error] ${msg.err}`, "err");
        return;
      }

      if (msg.type === "info") {
        log(`[info] ${msg.text}`, "muted");
        return;
      }

      log(`[msg] ${ev.data}`, "muted");
    };

    loadConversations();
  }

  function addMessage(msg) {
    const convId = msg.conversation_id || conversationId(msg.from, msg.to);
    if (!conversationMeta.has(convId)) {
      const other = msg.from === me ? msg.to : msg.from;
      const profile = userProfiles.get(other) || {};
      conversationMeta.set(convId, {
        username: other,
        firstName: profile.firstName || "",
        lastName: profile.lastName || "",
        avatarHex: profile.avatarHex || "",
        avatarData: profile.avatarData || "",
      });
    }
    if (!unreadCounts.has(convId)) {
      unreadCounts.set(convId, 0);
    }
    const list = messagesByConv.get(convId) || [];
    list.push(msg);
    messagesByConv.set(convId, list);

    if (msg.from === me && msg.message_id) {
      messageStatus.set(String(msg.message_id), "sent");
    }

    if (msg.from !== me && activeConversation !== convId) {
      unreadCounts.set(convId, (unreadCounts.get(convId) || 0) + 1);
    }

    renderConversations();

    if (!activeConversation) {
      setActiveConversation(convId);
    }

    if (activeConversation === convId) {
      renderConversation(convId);
    }
  }

  function setOnlineUsers(users) {
    onlineUsers.clear();
    users.forEach((user) => onlineUsers.add(user));
    renderConversations();
    if (lastSearchMode) {
      renderSearchResults(lastSearchResults, lastSearchMode);
    }
    updatePeerStatus();
  }

  function applyProfileUpdate(profile) {
    userProfiles.set(profile.username, {
      firstName: profile.first_name || "",
      lastName: profile.last_name || "",
      avatarHex: profile.avatar_hex || "",
      avatarData: profile.avatar_data || "",
    });

    for (const [convId, meta] of conversationMeta.entries()) {
      if (meta.username === profile.username) {
        conversationMeta.set(convId, {
          ...meta,
          firstName: profile.first_name || "",
          lastName: profile.last_name || "",
          avatarHex: profile.avatar_hex || "",
          avatarData: profile.avatar_data || "",
        });
      }
    }

    if (activePeer === profile.username) {
      peerNameEl.textContent = displayName(activePeer);
      setAvatar(peerAvatarEl, profile.avatar_hex || "", profile.avatar_data || "");
    }
    renderConversations();
  }

  function updatePeerStatus() {
    if (!activePeer) {
      peerStatusEl.textContent = "";
      return;
    }
    peerStatusEl.textContent = onlineUsers.has(activePeer) ? "(online)" : "(offline)";
  }

  function renderConversations() {
    const convIds = Array.from(messagesByConv.keys());
    convIds.sort();
    conversationsEl.innerHTML = "";

    convIds.forEach((convId) => {
      const meta = conversationMeta.get(convId);
      const other = meta ? meta.username : (() => {
        const [a, b] = convId.split("|");
        return a === me ? b : a;
      })();
      const isOnline = other && onlineUsers.has(other);
      const btn = document.createElement("button");
      const label = other ? displayName(other) : convId;
      const unread = unreadCounts.get(convId) || 0;
      btn.innerHTML = "";
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      const profile = userProfiles.get(other) || {};
      setAvatar(avatar, profile.avatarHex || "", profile.avatarData || "");

      const name = document.createElement("span");
      name.textContent = `${label}${isOnline ? " (online)" : ""}`;

      btn.appendChild(avatar);
      btn.appendChild(name);
      btn.className = convId === activeConversation ? "active" : "";
      if (unread > 0) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = String(unread);
        btn.appendChild(badge);
      }
      btn.onclick = () => setActiveConversation(convId);
      conversationsEl.appendChild(btn);
    });
  }

  function renderConversation(convId) {
    logEl.innerHTML = "";
    const list = messagesByConv.get(convId) || [];
    list.forEach((msg) => {
      const div = document.createElement("div");
      const key = messageKey(msg);
      const selected = selectedMessages.has(key);
      div.className = "msg " + (msg.from === me ? "out message-sent" : "in") + (highlightKey === key ? " hit" : "") + (selected ? " selected" : "");
      div.dataset.key = key;
      const text = document.createElement("div");
      text.textContent = msg.text;
      div.appendChild(text);
      if (msg.from === me && msg.message_id) {
        messageStatus.set(String(msg.message_id), "sent");
      }
      div.addEventListener("click", () => {
        toggleMessageSelection(msg);
      });
      logEl.appendChild(div);
    });
    logEl.scrollTop = logEl.scrollHeight;
    if (highlightKey) {
      const hit = logEl.querySelector(`[data-key="${CSS.escape(highlightKey)}"]`);
      if (hit) {
        hit.scrollIntoView({ block: "center" });
      }
    }
  }

  function setActiveConversation(convId) {
    activeConversation = convId;
    const [a, b] = convId.split("|");
    const meta = conversationMeta.get(convId);
      if (meta && meta.username) {
        activePeer = meta.username;
        if (meta.firstName || meta.lastName || meta.avatarHex || meta.avatarData) {
          userProfiles.set(meta.username, {
            firstName: meta.firstName,
            lastName: meta.lastName,
            avatarHex: meta.avatarHex || "",
            avatarData: meta.avatarData || "",
          });
        }
      } else {
      activePeer = a === me ? b : a;
    }
    peerNameEl.textContent = activePeer ? displayName(activePeer) : "-";
    const peerProfile = userProfiles.get(activePeer) || {};
    setAvatar(peerAvatarEl, peerProfile.avatarHex || "", peerProfile.avatarData || "");
    updatePeerStatus();
    highlightKey = null;
    selectedMessages.clear();
    updateActions();
    unreadCounts.set(convId, 0);
    renderConversations();
    renderConversation(convId);

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "history", conversation_id: convId, limit: 200 }));
    }
    logEl.classList.add("fade-in");
    setTimeout(() => logEl.classList.remove("fade-in"), 220);
  }

  function sendDM() {
    const rawText = textEl.value;
    if (!activePeer || !rawText.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;

    ws.send(JSON.stringify({ type: "dm", to: activePeer, text: rawText }));
    textEl.value = "";
    textEl.focus();
  }

  sendBtn.onclick = sendDM;
  searchEl.addEventListener("input", () => {
    const query = searchEl.value.trim();
    if (!query) {
      lastSearchResults = [];
      lastSearchMode = "";
      renderSearchResults([]);
      return;
    }
    if (query.startsWith("@")) {
      lastSearchMode = "users";
      searchUsers(query.slice(1));
      return;
    }
    lastSearchMode = "messages";
    searchMessages(query);
  });
  textEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendDM();
    }
  });

  if (hydrateAuth()) {
    connectWS();
  }

  async function searchUsers(query) {
    if (!token) return;
    const res = await fetch(`/users?query=${encodeURIComponent(query)}`, {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) {
      log(`[search] failed`, "err");
      return;
    }
    const data = await res.json();
    const items = data.items || [];
    items.forEach((u) => {
      userProfiles.set(u.username, {
        firstName: u.first_name || "",
        lastName: u.last_name || "",
        avatarHex: u.avatar_hex || "",
        avatarData: u.avatar_data || "",
      });
    });
    const exact = items.filter((u) => u.username === query);
    lastSearchResults = exact;
    lastSearchMode = "users";
    renderSearchResults(lastSearchResults, "users");
  }

  async function searchMessages(query) {
    if (!token) return;
    const res = await fetch(`/messages/search?query=${encodeURIComponent(query)}`, {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) {
      log(`[search] failed`, "err");
      return;
    }
    const data = await res.json();
    lastSearchResults = data.items || [];
    lastSearchMode = "messages";
    renderSearchResults(lastSearchResults, "messages");
  }

  function renderSearchResults(items, mode) {
    searchResultsEl.innerHTML = "";
    if (mode === "users") {
      items.forEach((user) => {
        const btn = document.createElement("button");
        btn.innerHTML = "";
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      setAvatar(avatar, user.avatar_hex || "", user.avatar_data || "");
        const name = document.createElement("span");
        const label = displayName(user.username);
        name.textContent = `${label}${onlineUsers.has(user.username) ? " (online)" : ""}`;
        btn.appendChild(avatar);
        btn.appendChild(name);

        if (user.username === me) {
          btn.disabled = true;
        } else {
          btn.onclick = () => {
            const convId = conversationId(me, user.username);
            if (!messagesByConv.has(convId)) {
              messagesByConv.set(convId, []);
            }
            conversationMeta.set(convId, {
              username: user.username,
              firstName: user.first_name || "",
              lastName: user.last_name || "",
              avatarHex: user.avatar_hex || "",
              avatarData: user.avatar_data || "",
            });
            setActiveConversation(convId);
          };
        }
        searchResultsEl.appendChild(btn);
      });
      return;
    }

    items.forEach((msg) => {
      const btn = document.createElement("button");
      const other = msg.from === me ? msg.to : msg.from;
      const prefix = other ? `${displayName(other)}: ` : "";
      const text = (msg.text || "").replace(/\s+/g, " ").slice(0, 80);
      btn.textContent = prefix + text;
      btn.onclick = () => {
        openConversationAndHighlight(msg);
      };
      searchResultsEl.appendChild(btn);
    });
  }

  function openConversationAndHighlight(msg) {
    const convId = msg.conversation_id || msg.conversationId;
    if (!convId) return;
    if (!messagesByConv.has(convId)) {
      messagesByConv.set(convId, []);
    }
    if (!conversationMeta.has(convId)) {
      const other = msg.from === me ? msg.to : msg.from;
      const profile = userProfiles.get(other) || {};
      conversationMeta.set(convId, {
        username: other,
        firstName: profile.firstName || "",
        lastName: profile.lastName || "",
        avatarHex: profile.avatarHex || "",
        avatarData: profile.avatarData || "",
      });
    }
    if (!unreadCounts.has(convId)) {
      unreadCounts.set(convId, 0);
    }
    const key = messageKey(msg);
    pendingHighlight = { convId, key };
    setActiveConversation(convId);
  }

  function openChatSearch() {
    if (!activeConversation) return;
    chatSearchInput.value = "";
    chatSearchResults.innerHTML = "";
    chatSearchModal.classList.add("open");
    chatSearchInput.focus();
  }

  function closeChatSearch() {
    chatSearchModal.classList.remove("open");
  }

  function renderChatSearchResults(items) {
    chatSearchResults.innerHTML = "";
    items.forEach((msg) => {
      const btn = document.createElement("button");
      const text = (msg.text || "").replace(/\s+/g, " ").slice(0, 120);
      btn.textContent = text;
      btn.onclick = () => {
        openConversationAndHighlight(msg);
        closeChatSearch();
      };
      chatSearchResults.appendChild(btn);
    });
  }

  function searchInActiveChat(query) {
    const convId = activeConversation;
    if (!convId) return [];
    const list = messagesByConv.get(convId) || [];
    const needle = query.toLowerCase();
    return list.filter((msg) => (msg.text || "").toLowerCase().includes(needle));
  }

  chatSearchBtn.onclick = openChatSearch;
  chatSearchClose.onclick = closeChatSearch;
  chatSearchModal.addEventListener("click", (e) => {
    if (e.target === chatSearchModal) closeChatSearch();
  });
  chatSearchInput.addEventListener("input", () => {
    const q = chatSearchInput.value.trim();
    if (!q) {
      chatSearchResults.innerHTML = "";
      return;
    }
    const items = searchInActiveChat(q);
    renderChatSearchResults(items);
  });

  function toggleMessageSelection(msg) {
    const key = messageKey(msg);
    if (selectedMessages.has(key)) {
      selectedMessages.delete(key);
    } else {
      selectedMessages.set(key, msg);
    }
    updateActions();
    renderConversation(activeConversation);
  }

  function clearSelection() {
    selectedMessages.clear();
    updateActions();
    renderConversation(activeConversation);
  }

  function updateActions() {
    if (selectedMessages.size === 0) {
      messageActions.classList.remove("show");
      hideDeleteOptions();
      return;
    }
    messageActions.classList.add("show");
    const single = selectedMessages.size === 1;
    actionReply.disabled = !single;
    actionForward.disabled = false;
    actionCopy.disabled = false;
    hideDeleteOptions();
  }

  function removeMessageLocally(messageId) {
    if (!activeConversation) return;
    const list = messagesByConv.get(activeConversation) || [];
    const filtered = list.filter((msg) => messageKey(msg) !== String(messageId));
    messagesByConv.set(activeConversation, filtered);
    clearSelection();
  }

  function handleDeleted(msg) {
    const messageId = msg.message_id || msg.id;
    if (!messageId) return;
    selectedMessages.delete(String(messageId));
    updateActions();
    for (const [convId, list] of messagesByConv.entries()) {
      const filtered = list.filter((m) => messageKey(m) !== String(messageId));
      if (filtered.length !== list.length) {
        messagesByConv.set(convId, filtered);
        if (activeConversation === convId) {
          renderConversation(convId);
        }
      }
    }
  }

  actionDelete.onclick = () => {
    if (selectedMessages.size === 0) return;
    showDeleteOptions();
  };

  deleteMine.onclick = () => {
    if (selectedMessages.size === 0) return;
    const ids = Array.from(selectedMessages.keys());
    ids.forEach((id) => removeMessageLocally(id));
  };

  deleteAll.onclick = () => {
    if (selectedMessages.size === 0 || !ws || ws.readyState !== WebSocket.OPEN) return;
    const ids = Array.from(selectedMessages.keys());
    ids.forEach((id) => {
      ws.send(JSON.stringify({ type: "delete", message_id: Number(id), scope: "all" }));
    });
    hideDeleteOptions();
    clearSelection();
  };

  actionReply.onclick = () => {
    if (selectedMessages.size !== 1) return;
    const msg = selectedMessages.values().next().value;
    const prefix = `> ${msg.text || ""}\n`;
    textEl.value = prefix + textEl.value;
    textEl.focus();
  };

  actionForward.onclick = () => {
    if (selectedMessages.size === 0 || !ws || ws.readyState !== WebSocket.OPEN) return;
    openForwardModal();
  };

  actionCopy.onclick = async () => {
    if (selectedMessages.size === 0) return;
    const text = Array.from(selectedMessages.values())
      .map((msg) => msg.text || "")
      .join("\n\n");
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const tmp = document.createElement("textarea");
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand("copy");
      document.body.removeChild(tmp);
    }
  };

  logEl.addEventListener("click", (e) => {
    if (e.target === logEl) {
      clearSelection();
    }
  });

  function openForwardModal() {
    forwardList.innerHTML = "";
    const selected = Array.from(selectedMessages.values());
    const convIds = Array.from(conversationMeta.keys());
    convIds.forEach((convId) => {
      const meta = conversationMeta.get(convId);
      if (!meta || !meta.username) return;
      const btn = document.createElement("button");
      const label = displayName(meta.username);
      btn.innerHTML = "";
      const avatar = document.createElement("span");
      avatar.className = "avatar";
      const metaProfile = userProfiles.get(meta.username) || {};
      setAvatar(avatar, meta.avatarHex || metaProfile.avatarHex || "", meta.avatarData || metaProfile.avatarData || "");
      const name = document.createElement("span");
      name.textContent = label || meta.username;
      btn.appendChild(avatar);
      btn.appendChild(name);
      btn.onclick = () => {
        selected.forEach((msg) => {
          ws.send(JSON.stringify({ type: "dm", to: meta.username, text: msg.text || "" }));
        });
        forwardModal.classList.remove("open");
        clearSelection();
      };
      forwardList.appendChild(btn);
    });
    forwardModal.classList.add("open");
  }

  forwardClose.onclick = () => forwardModal.classList.remove("open");
  forwardModal.addEventListener("click", (e) => {
    if (e.target === forwardModal) forwardModal.classList.remove("open");
  });

  async function openProfile(username) {
    if (!token) return;
    const target = username || me;
    const url = `/profile?user=${encodeURIComponent(target)}`;
    const res = await fetch(url, {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) {
      log(`[profile] failed`, "err");
      return;
    }
    const data = await res.json();
    const isMe = data.username === me;
    profileFirstNameText.textContent = data.first_name || "";
    profileLastNameText.textContent = data.last_name || "";
    profileUsernameEl.textContent = `@${data.username}`;
    setAvatar(profileAvatarEl, data.avatar_hex || "", data.avatar_data || "");
    userProfiles.set(data.username, {
      firstName: data.first_name || "",
      lastName: data.last_name || "",
      avatarHex: data.avatar_hex || "",
      avatarData: data.avatar_data || "",
    });
    profileAvatarData = data.avatar_data || "";
    profileFirstNameEl.value = data.first_name || "";
    profileLastNameEl.value = data.last_name || "";

    profileEditBtn.style.display = isMe ? "inline-block" : "none";
    profileLogoutBtn.style.display = isMe ? "inline-block" : "none";
    profileDeleteBtn.style.display = isMe ? "inline-block" : "none";
    profileModal.classList.add("open");
  }

  profileBtn.onclick = () => openProfile(me);
  peerAvatarEl.onclick = () => {
    if (activePeer) openProfile(activePeer);
  };

  profileCloseBtn.onclick = () => profileModal.classList.remove("open");
  profileCancelBtn.onclick = () => profileEditModal.classList.remove("open");
  profileModal.addEventListener("click", (e) => {
    if (e.target === profileModal) profileModal.classList.remove("open");
  });

  profileSaveBtn.onclick = async () => {
    await saveProfileChanges();
    profileEditModal.classList.remove("open");
  };

  profileLogoutBtn.onclick = () => {
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    location.href = "/login.html";
  };

  profileDeleteBtn.onclick = async () => {
    if (!token || !me) return;
    if (!confirm("Удалить аккаунт и историю сообщений?")) return;
    const res = await fetch("/delete", {
      method: "POST",
      headers: { "Authorization": `Bearer ${token}` },
    });
    if (!res.ok) {
      log(`[delete] failed`, "err");
      return;
    }
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    location.href = "/login.html";
  };

  profileEditBtn.onclick = () => {
    profileEditModal.classList.add("open");
  };

  profileEditModal.addEventListener("click", (e) => {
    if (e.target === profileEditModal) profileEditModal.classList.remove("open");
  });

  profileAvatarEl.onclick = () => {
    if (profileEditBtn.style.display === "none") return;
    avatarFile.click();
  };

  avatarFile.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        cropState = initCropState(img, avatarCanvas);
        drawCrop();
        avatarCropModal.classList.add("open");
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  avatarCancel.onclick = () => {
    avatarCropModal.classList.remove("open");
    avatarFile.value = "";
  };

  avatarApply.onclick = () => {
    if (!cropState) return;
    profileAvatarData = applyCrop(cropState);
    setAvatar(profileAvatarEl, "", profileAvatarData);
    avatarCropModal.classList.remove("open");
    avatarFile.value = "";
    saveProfileChanges();
  };

  avatarCropModal.addEventListener("click", (e) => {
    if (e.target === avatarCropModal) avatarCropModal.classList.remove("open");
  });

  async function saveProfileChanges() {
    if (!token) return;
    const res = await fetch("/profile/update", {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({
        firstName: profileFirstNameEl.value.trim(),
        lastName: profileLastNameEl.value.trim(),
        avatarHex: "",
        avatarData: profileAvatarData,
      }),
    });
    if (!res.ok) {
      log(`[profile] save failed`, "err");
      return;
    }
    const data = await res.json();
    userProfiles.set(data.username, {
      firstName: data.first_name || "",
      lastName: data.last_name || "",
      avatarHex: data.avatar_hex || "",
      avatarData: data.avatar_data || "",
    });
    profileFirstNameText.textContent = data.first_name || "";
    profileLastNameText.textContent = data.last_name || "";
    for (const [convId, meta] of conversationMeta.entries()) {
      if (meta.username === data.username) {
        conversationMeta.set(convId, {
          ...meta,
          firstName: data.first_name || "",
          lastName: data.last_name || "",
          avatarHex: data.avatar_hex || "",
          avatarData: data.avatar_data || "",
        });
      }
    }
    if (activePeer === data.username) {
      peerNameEl.textContent = displayName(activePeer);
      setAvatar(peerAvatarEl, data.avatar_hex || "", data.avatar_data || "");
    }
    renderConversations();
  }

  function showDeleteOptions() {
    actionDelete.classList.add("hidden");
    actionReply.classList.add("hidden");
    actionForward.classList.add("hidden");
    actionCopy.classList.add("hidden");
    deleteMine.classList.remove("hidden");
    deleteAll.classList.remove("hidden");
  }

  function hideDeleteOptions() {
    actionDelete.classList.remove("hidden");
    actionReply.classList.remove("hidden");
    actionForward.classList.remove("hidden");
    actionCopy.classList.remove("hidden");
    deleteMine.classList.add("hidden");
    deleteAll.classList.add("hidden");
  }

  function applyTheme(next) {
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    themeToggle.innerHTML = next === "dark"
      ? '<span class="theme-dot"></span> Day'
      : '<span class="theme-dot"></span> Night';
  }

  const savedTheme = localStorage.getItem("theme") || "light";
  applyTheme(savedTheme);
  themeToggle.onclick = () => {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    applyTheme(current === "dark" ? "light" : "dark");
  };

  function initCropState(img, canvas) {
    const ctx = canvas.getContext("2d");
    const size = Math.min(img.width, img.height);
    const scale = canvas.width / size;
    const sx = (img.width - size) / 2;
    const sy = (img.height - size) / 2;
    return {
      img,
      ctx,
      canvas,
      sx,
      sy,
      size,
      scale,
      cx: canvas.width / 2,
      cy: canvas.height / 2,
      r: canvas.width / 3,
      drag: false,
      dragOffsetX: 0,
      dragOffsetY: 0,
    };
  }

  function drawCrop() {
    if (!cropState) return;
    const { ctx, canvas, img, sx, sy, size, scale, cx, cy, r } = cropState;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, sx, sy, size, size, 0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function applyCrop(state) {
    const outSize = 128;
    const out = document.createElement("canvas");
    out.width = outSize;
    out.height = outSize;
    const octx = out.getContext("2d");

    const scale = state.size / state.canvas.width;
    const cropX = state.sx + (state.cx - state.r) * scale;
    const cropY = state.sy + (state.cy - state.r) * scale;
    const cropSize = state.r * 2 * scale;

    octx.save();
    octx.beginPath();
    octx.arc(outSize / 2, outSize / 2, outSize / 2, 0, Math.PI * 2);
    octx.closePath();
    octx.clip();
    octx.drawImage(
      state.img,
      cropX,
      cropY,
      cropSize,
      cropSize,
      0,
      0,
      outSize,
      outSize
    );
    octx.restore();
    return out.toDataURL("image/png");
  }

  function bindCropEvents() {
    if (!avatarCanvas) return;
    avatarCanvas.addEventListener("mousedown", (e) => {
      if (!cropState) return;
      const rect = avatarCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const dx = x - cropState.cx;
      const dy = y - cropState.cy;
      if (Math.hypot(dx, dy) <= cropState.r) {
        cropState.drag = true;
        cropState.dragOffsetX = dx;
        cropState.dragOffsetY = dy;
      }
    });
    window.addEventListener("mousemove", (e) => {
      if (!cropState || !cropState.drag) return;
      const rect = avatarCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      cropState.cx = x - cropState.dragOffsetX;
      cropState.cy = y - cropState.dragOffsetY;
      cropState.cx = Math.max(cropState.r, Math.min(cropState.cx, avatarCanvas.width - cropState.r));
      cropState.cy = Math.max(cropState.r, Math.min(cropState.cy, avatarCanvas.height - cropState.r));
      drawCrop();
    });
    window.addEventListener("mouseup", () => {
      if (cropState) {
        cropState.drag = false;
      }
    });
  }

  bindCropEvents();
})();
</script>
