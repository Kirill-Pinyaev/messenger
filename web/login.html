<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --panel: #fff7e6;
      --ink: #1b1b1b;
      --muted: #6b6b6b;
      --accent: #23685b;
      --accent-2: #c25b39;
      --line: #e5dfd3;
      --shadow: 0 18px 40px rgba(18, 20, 19, 0.08);
      font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1000px 500px at 10% 0%, #ffe5c4 0%, transparent 60%),
        radial-gradient(800px 500px at 90% 20%, #cfe8e2 0%, transparent 60%),
        radial-gradient(800px 500px at 50% 100%, #f7d0e0 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
    }
    .card { width: min(440px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); animation: rise 180ms ease; }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.3px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal .card { width: min(520px, 94vw); }
    input, button { padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    input:focus { outline: 2px solid rgba(35, 104, 91, 0.2); border-color: rgba(35, 104, 91, 0.5); }
    button { background: var(--accent); color: white; border: none; cursor: pointer; box-shadow: 0 6px 16px rgba(35, 104, 91, 0.2); transition: transform 120ms ease, box-shadow 120ms ease; }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 18px rgba(35, 104, 91, 0.25); }
    button.secondary { background: #2b2b2b; }
    .stack { display: grid; gap: 10px; }
    #msg { min-height: 18px; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход в мессенджер</h1>
    <div class="muted">Регистрация и вход для тестового чата</div>

    <div class="stack" style="margin-top: 12px;">
      <input id="username" placeholder="nickname" />
      <input id="password" type="password" placeholder="password" />
      <div class="row">
        <button id="register">Регистрация</button>
        <button id="login" class="secondary">Войти</button>
      </div>
      <div class="muted" id="msg"></div>
    </div>
  </div>

  <div class="modal" id="registerModal">
    <div class="card">
      <h1>Регистрация</h1>
      <div class="muted">Имя и фамилия могут повторяться, никнейм уникален</div>
      <div class="stack" style="margin-top: 12px;">
        <input id="regFirstName" placeholder="Имя" />
        <input id="regLastName" placeholder="Фамилия" />
        <input id="regUsername" placeholder="Никнейм" />
        <input id="regPassword" type="password" placeholder="Пароль" />
        <input id="regPassword2" type="password" placeholder="Повторите пароль" />
        <div class="row">
          <button id="regSubmit">Создать</button>
          <button id="regCancel" class="secondary">Отмена</button>
        </div>
        <div class="muted" id="regMsg"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const msgEl = document.getElementById("msg");
  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const registerBtn = document.getElementById("register");
  const loginBtn = document.getElementById("login");
  const registerModal = document.getElementById("registerModal");
  const regFirstNameEl = document.getElementById("regFirstName");
  const regLastNameEl = document.getElementById("regLastName");
  const regUsernameEl = document.getElementById("regUsername");
  const regPasswordEl = document.getElementById("regPassword");
  const regPassword2El = document.getElementById("regPassword2");
  const regSubmitBtn = document.getElementById("regSubmit");
  const regCancelBtn = document.getElementById("regCancel");
  const regMsgEl = document.getElementById("regMsg");

  if (localStorage.getItem("token") && localStorage.getItem("username")) {
    location.href = "/";
    return;
  }

  function openRegister() {
    regMsgEl.textContent = "";
    regFirstNameEl.value = "";
    regLastNameEl.value = "";
    regUsernameEl.value = usernameEl.value.trim();
    regPasswordEl.value = "";
    regPassword2El.value = "";
    registerModal.classList.add("open");
  }

  function closeRegister() {
    registerModal.classList.remove("open");
  }

  async function login() {
    msgEl.textContent = "";
    const username = usernameEl.value.trim();
    const password = passwordEl.value;
    if (!username || !password) {
      msgEl.textContent = "нужны username и password";
      return;
    }

    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });

    if (!res.ok) {
      msgEl.textContent = await res.text();
      return;
    }

    const data = await res.json();
    if (!data.token) {
      msgEl.textContent = "no token";
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("username", username);
    location.href = "/";
  }

  async function submitRegister() {
    regMsgEl.textContent = "";
    const firstName = regFirstNameEl.value.trim();
    const lastName = regLastNameEl.value.trim();
    const username = regUsernameEl.value.trim();
    const password = regPasswordEl.value;
    const password2 = regPassword2El.value;
    if (!username || !password) {
      regMsgEl.textContent = "нужны никнейм и пароль";
      return;
    }
    if (password !== password2) {
      regMsgEl.textContent = "пароли не совпадают";
      return;
    }

    const res = await fetch("/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, firstName, lastName }),
    });

    if (!res.ok) {
      regMsgEl.textContent = await res.text();
      return;
    }

    msgEl.textContent = "registered, now login";
    usernameEl.value = username;
    closeRegister();
  }

  registerBtn.onclick = openRegister;
  regCancelBtn.onclick = closeRegister;
  regSubmitBtn.onclick = submitRegister;
  loginBtn.onclick = login;
  passwordEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") login();
  });

  registerModal.addEventListener("click", (e) => {
    if (e.target === registerModal) closeRegister();
  });
})();
</script>
</body>
</html>
